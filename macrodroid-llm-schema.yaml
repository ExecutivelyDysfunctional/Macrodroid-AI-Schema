     m_expression: [str, 'when:m_intExpression', magic, "expr"]
     m_newDoubleValue?: [double, "Decimal"]
     m_doubleRandomMin: [double, 'when:m_intRandom && decimal type', "rand min"]
     m_doubleRandomMax: [double, 'when:m_intRandom && decimal type', "rand max"]
     m_userPromptTitle?: [str, magic, "prompt title"]
     m_userPromptMessage?: [str, magic, "prompt msg"]
     m_userPromptShowCancel?: [bool, T, "show cancel"]
