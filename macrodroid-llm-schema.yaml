    SamsungRoutinesAction:
     description: Invoke a Samsung Modes & Routines manual routine (Samsung devices only)
     note: |
       The app picks one of three runtime modes by probing device capability (not the app version):
       - LEGACY: content providers respond → routine controlled by name via content provider; actionMode (Start/Stop/Toggle) and endPreviousBeforeStart honoured; routineName supports magic text.
       - SHORTCUT (One UI 8.5 / Routines v5+): providers blocked but a CREATE_SHORTCUT picker exists → routine picked interactively so its UUID is captured, then launched via ShortcutLaunchActivity which always TOGGLES (actionMode/endPreviousBeforeStart ignored); magic text / free-text name NOT supported; actions configured before the lockdown (no routineUuid) must be reconfigured.
       - BLOCKED (One UI 8.0 / Routines 4.9): providers are signature-walled (READ_ROUTINE_INFO became a signature permission) AND there is no picker → no third-party mechanism remains. The action cannot run on this device, shows a warning, and is skipped (logged) at runtime. There is currently no workaround.
     params:
     routineName: [str, req, magic, "Manual routine name (legacy versions only; on Samsung Routines v5+ this is set by the picker and not user-editable)"]
     actionMode?: [int, def:0, '{0:Start, 1:Stop, 2:Toggle}', "Action to perform (ignored on Samsung Routines v5+; always toggles there)"]
     endPreviousBeforeStart?: [bool, def:false, "End the routine first then start (legacy versions only)"]
     routineUuid?: [long, "Captured Samsung routine UUID, required on Routines v5+; set via the interactive picker — do not edit by hand"]

