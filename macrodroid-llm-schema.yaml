    SendIntentAction:
     description: Send an Android intent (broadcast, activity, or service)
     notes:
     - 'Do NOT use this to call a web API or fetch a URL. An Activity intent with android.intent.action.VIEW and an http(s) m_data just hands the URL to a browser for the user to look at, and fails with "No Activity found to handle Intent" when nothing on the device can open it. Use HttpRequestAction instead.'
     - Only use m_action android.intent.action.VIEW when the intent is genuinely meant to open something on screen (a web page, a map, a document).
     - m_data must be a complete URI including scheme. Leading and trailing whitespace is stripped before it is parsed.
     - Boolean extras accept true/false in any case, including the localised True/False text that boolean variables expand to (e.g. {lv=my_bool}).
     - To share a file with another app (e.g. m_action android.intent.action.SEND with m_mimeType image/*), put the file in an extra named android.intent.extra.STREAM with type 8 (URI). The value can be a file path, a file:// uri or a content:// uri (such as one from the Shared File trigger); paths are exposed to the receiving app through a content uri and read permission is granted automatically.
     params:
     m_target:
     - str
     - req
     - '{Activity:Start an activity, Broadcast:Send a broadcast, Service:Start a service}'
     - "Intent target type"
     m_action?: [str, magic, "e.g., android.intent.action.VIEW"]
     m_packageName?: [str, magic, "Target package name"]
     m_className?: [str, magic, "Target class name"]
     m_data?: [str, magic, "Intent data URI"]
     m_mimeType?: [str, magic, "MIME type"]
     m_category?: [str, "Intent category (android.intent.category.*)"]
     customCategoryValue?: [str, magic, "Custom category"]
     useCustomCategory?: [bool, "Use custom category instead of predefined"]
     m_extra1Name?: [str, "Extra 1 key name"]
     m_extra1Value?: [str, magic, "Extra 1"]
     m_extra1Type:
     - int
     - opt
     - def:0
     - '{0:Auto-detect, 1:String, 2:Boolean, 3:Integer, 4:Long, 5:Float, 6:Double, 7:String Array, 8:URI}'
     - "Extra 1 data type"
     m_extra2Name?: [str, "Extra 2 key name"]
     m_extra2Value?: [str, magic, "Extra 2"]
     m_extra2Type?: [int, "Extra 2 data type (same values as m_extra1Type)"]
     m_extra3Name?: [str]
     m_extra3Value?: [str, magic]
     m_extra3Type?: [int]
     m_extra4Name?: [str]
     m_extra4Value?: [str, magic]
     m_extra4Type?: [int]
     m_extra5Name?: [str]
     m_extra5Value?: [str, magic]
     m_extra5Type?: [int]
     m_extra6Name?: [str]
     m_extra6Value?: [str, magic]
     m_extra6Type?: [int]
     additionalExtras?: [arr, 'items:IntentExtra', "Extras beyond the first six - each item MUST use name/value/type fields (see IntentExtra type). Only use once m_extra1..m_extra6 are all filled."]
     m_flags?: [int, "Combined intent flags (bitmask)"]

