    SensorReadAction:
     description: Perform a one-off read of a device sensor and save the result into a variable. Blocks until the sensor is read (or up to 5 seconds). Only sensors that can be sampled in real time are supported (continuous and on-change sensors); one-shot/trigger sensors such as significant motion, step detector and heart beat are not. Single-value sensors (light, proximity, pressure, temperature, humidity, step counter, heart rate) save into a decimal variable; multi-value sensors (accelerometer, gyroscope, magnetic field, gravity, rotation vector, orientation) save into a dictionary variable with named keys (e.g. x, y, z). The device orientation sensor (type 27) saves value0 = 0 portrait, 1 rotated 90 degrees, 2 upside down, 3 rotated 270 degrees, or -1 when the device is flat; if the driver does not report within 1 second the orientation is derived from the accelerometer. Body sensors (heart rate 21, low latency off-body detect 34) are unavailable on Android 16+ because they require a health permission MacroDroid does not hold - do not use them in macros targeting Android 16+ devices.
     params:
     sensorType: [int, "Android Sensor.TYPE_* constant of the sensor to read (e.g. 5=light, 8=proximity, 6=pressure, 1=accelerometer, 4=gyroscope, 2=magnetic field, 11=rotation vector)"]
     sensorName?: [str, "Exact sensor name used to disambiguate when multiple sensors share a type; falls back to the default sensor of that type"]
     readingVariableName: [str, "Variable name the reading is saved into (decimal for single-value sensors, dictionary for multi-value sensors)"]
     readingDictionaryKeys?: [dictkeys, "Optional base dictionary keys for the reading variable"]
     successVariableName?: [str, "Optional boolean variable set true on a successful read, false on timeout/failure"]
     successDictionaryKeys?: [dictkeys, "Optional dictionary keys for the success variable"]

