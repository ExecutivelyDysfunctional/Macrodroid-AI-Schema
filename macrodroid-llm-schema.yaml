        stringOutputVariable: { ?varName?: [str]}
        keyOutputVariable: { ?varName?: [str]}
        visibilityVariable: { ?varName?: [str]}
        padding?: [str, 'def:"8"', "dp"]

    SceneOptionSelectorConfig:
      for_type: "SceneOptionSelector"
      field_name: sceneOptionSelectorConfig
      fields:
        textColor?: [int, 'def:-1']
        textSize?: [str, 'def:"16"']
        multiSelect?: [bool]
        useKeys?: [bool, "show keys not values"]
        arrayVariable: { ?varName?: [str, "dictionary/array variable containing the options (there is no inline options list)"]}
        stringOutputVariable: { ?varName?: [str, "single select: receives the selected value"]}
        keyOutputVariable: { ?varName?: [str, "single select: receives the selected key"]}
        valuesArrayOutputVariable: { ?varName?: [str, "multiSelect: array receiving the selected values"]}
        keysArrayOutputVariable: { ?varName?: [str, "multiSelect: array receiving the selected keys"]}
        fontFamily?: [str]
        visibilityVariable: { ?varName?: [str]}
        padding?: [str, 'def:"8"', "dp"]

    SceneImageConfig:
      for_type: "SceneImage"
      field_name: sceneImageConfig
      fields:
        width: [int, "% 5-100"]
        height: [int, "% 5-100"]
        alignment: {_t: enum, values: [Start, End, Center], default: Start}
        disableCache?: [bool]
        sceneImageData:
          imageResourceName?: [str]
          imageResourceId?: [int]
          imagePackageName?: [str]
          imageUri?: [str, "path/URI/URL"]
          type?: [str, '{STATIC_FILE,DYNAMIC_FILE,URL,GIPHY}', 'def:STATIC_FILE']
          directoryUri?: [str, "SAF tree URI for dynamic file"]
          filename?: [str, "filename with magic text for dynamic file"]
          useAllFilesAccess?: [bool, "use All Files Access instead of SAF"]
          allFilesDirectoryPath?: [str, "direct path for All Files Access mode"]
        buttonClickConfig: {runnableItem: { ?name?: [str], guid?: [long, "action block m_GUID reference - NOT 0"]}}
        closeSceneOnPress?: [bool]
        variableToUpdate: { ?varName?: [str]}
        variableUpdateValue?: [SceneVariableUpdateValue, "CRITICAL: StringValue uses 'label' (NOT 'textValue'). See DataTypes.SceneVariableUpdateValue."]
        visibilityVariable: { ?varName?: [str]}
        padding?: [str, 'def:"8"', "dp"]

    SceneIconConfig:
      for_type: "SceneIcon"
      field_name: sceneIconConfig
      fields:
        size: [int, "dp 12-256"]
        alignment: {_t: enum, values: [Start, End, Center], default: Start}
        tintEnabled?: [bool]
        tintColor: [int, "ARGB"]
        sceneIconData:
          imageResourceName?: [str]
          imageResourceId?: [int]
          imagePackageName?: [str]
          imageUri?: [str]
        buttonClickConfig: {runnableItem: { ?name?: [str], guid?: [long, "action block m_GUID reference - NOT 0"]}}
        closeSceneOnPress?: [bool]
        variableToUpdate: { ?varName?: [str]}
        variableUpdateValue?: [SceneVariableUpdateValue, "CRITICAL: StringValue uses 'label' (NOT 'textValue'). See DataTypes.SceneVariableUpdateValue."]
        visibilityVariable: { ?varName?: [str]}
        padding?: [str, 'def:"8"', "dp"]

    SceneHorizontalDividerConfig:
      for_type: "SceneHorizontalDivider"
      field_name: config
      fields:
        dividerColor?: [int, 'def:-1']
        dividerHeight?: [int, 'def:2', "dp 1-20"]
        padding?: [int, 'def:16', "vertical padding dp 0-48"]
        visibilityVariable: { ?varName?: [str]}

    SceneSpacerConfig:
      for_type: "SceneSpacer"
      field_name: sceneSpacerConfig
      fields:
        widthDp?: [int, 'def:16', "dp 0-256"]
        heightDp?: [int, 'def:16', "dp 0-256"]
        visibilityVariable: { ?varName?: [str]}

    SceneProgressIndicatorConfig:
      for_type: "SceneProgressIndicator"
      field_name: sceneProgressIndicatorConfig
      fields:
        style?: [int, '{0:linear,1:circular}']
        indeterminate?: [bool, T]
        min?: [str, 'def:"0"']
        max?: [str, 'def:"100"']
        current?: [str, 'def:"50"']
        trackColor?: [int, 'def:-1']
        size?: [int, 'def:100', "% 20-100"]
        thickness?: [int, 'def:4', "dp 1-20"]
        alignment: {_t: enum, values: [Start, End, Center], default: Center}
        visibilityVariable: { ?varName?: [str]}
        padding?: [str, 'def:"16"', "dp"]

    SceneWebViewConfig:
      for_type: "SceneWebView"
      field_name: sceneWebViewConfig
      fields:
        url?: [str, "URL or HTML"]
        width?: [int, 'def:100', "% 20-100"]
        height?: [int, 'def:50', "% 20-100"]
        enableJavaScript?: [bool, T]
        enableSwipeNavigation?: [bool, T]
        buttonClickConfig: {runnableItem: { ?name?: [str], guid?: [long, "action block m_GUID reference - NOT 0"]}}
        closeSceneOnPress?: [bool]
        variableToUpdate: { ?varName?: [str]}
        variableUpdateValue?: [SceneVariableUpdateValue, "CRITICAL: StringValue uses 'label' (NOT 'textValue'). See DataTypes.SceneVariableUpdateValue."]
        visibilityVariable: { ?varName?: [str]}
        padding?: [str, 'def:"0"', "dp"]

    SceneMapViewConfig:
      for_type: "SceneMapView"
      field_name: sceneMapViewConfig
      fields:
        bindLocationToVariables?: [bool, 'def:false', "When true, location is read/written via the *Variable fields below and the latitude/longitude/zoom strings are ignored. When false, the strings are used (with magic text)."]
        latitude?: [str, 'def:"0"', "Used when bindLocationToVariables=false. Magic-text capable. If exactly {varname}, user pan also writes back to that variable."]
        longitude?: [str, 'def:"0"', "Used when bindLocationToVariables=false. Magic-text capable. If exactly {varname}, user pan also writes back to that variable."]
        zoom?: [str, 'def:"13"', "Used when bindLocationToVariables=false. Magic-text capable, 1-21. If exactly {varname}, user zoom writes back."]
        latitudeVariable: { ?varName?: [str, "decimal variable. Used when bindLocationToVariables=true. Two-way: read at render, written on user pan."]}
        longitudeVariable: { ?varName?: [str, "decimal variable. Used when bindLocationToVariables=true. Two-way: read at render, written on user pan."]}
        zoomVariable: { ?varName?: [str, "decimal variable. Used when bindLocationToVariables=true. Two-way: read at render, written on user zoom (preserves fractional zoom)."]}
        mapType: {_t: enum, values: [DEFAULT, SATELLITE, HYBRID, TERRAIN], default: DEFAULT}
        width?: [int, 'def:100', "% 20-100"]
        height?: [int, 'def:50', "% 20-100"]
        markersArrayVariable: { ?varName?: [str, "Array variable. Each element MUST be a Dictionary with keys: lat (decimal, required), lon (decimal, required), label (string, optional), hexColor (string, optional, e.g. \"#FF0000\"). Invalid/missing lat or lon entries are skipped."]}
        tappedMarkerVariable: { ?varName?: [str, "string variable; receives the tapped marker's label (or its index if label is empty)"]}
        showMyLocation?: [bool, "Shows the blue user-location dot. Needs ACCESS_FINE_LOCATION/COARSE_LOCATION at runtime; silently disabled if not granted."]
        showMyLocationButton?: [bool, "Shows the recenter-on-me button. Only effective when showMyLocation=true."]
        showZoomControls?: [bool]
        showCompass?: [bool]
        visibilityVariable: { ?varName?: [str]}
        enabledVariable: { ?varName?: [str]}
        padding?: [str, 'def:"0"', "dp"]

    SceneTimePickerConfig:
      for_type: "SceneTimePicker"
      field_name: sceneTimePickerConfig
      fields:
        text?: [str, "title"]
        textSize?: [str, 'def:"18"', "sp"]
        textColor?: [int, 'def:-1']
        useAmPm?: [bool]
        showBorder?: [bool]
        fontFamily?: [str]
        dictionaryVariable: {varName: [str]}
        visibilityVariable: { ?varName?: [str]}
        padding?: [str, 'def:"0"', "dp"]

    SceneDatePickerConfig:
      for_type: "SceneDatePicker"
      field_name: sceneCalendarConfig
      fields:
        text?: [str, "title"]
        textSize?: [str, 'def:"20"', "sp"]
        textColor?: [int, 'def:-1']
        showBorder?: [bool, T]
        fontFamily?: [str]
        dictionaryVariable: {varName: [str]}
        visibilityVariable: { ?varName?: [str]}
        padding?: [str, 'def:"8"', "dp"]

    SceneHorizontalLayoutConfig:
      for_type: "SceneHorizontalLayout"
      field_name: sceneHorizontalLayoutConfig
      scene_item_fields:
        children: [arr, "REQUIRED - nested SceneItems at the SceneItem level (alongside type/guid), NOT inside config. Each child needs type, guid, and config"]
      fields:
        alignment: {_t: enum, values: [Start, End, Center], default: Start}
        visibilityVariable: { ?varName?: [str]}
        enabledVariable: { ?varName?: [str]}
        repeatConfig: { ?isEnabled?: [bool, 'def:false'], ?dataSource?: {varName: [str], dictionaryKeys?: [arr, "optional key path to a nested dictionary/array, e.g. ['foo1'] to repeat over d1[foo1]"]}, _note: "when isEnabled+dataSource set, children render once per array/dict entry; descendants reference current item via {item}, {item.key}, {item.value}, {item.index}" }

    SceneVerticalLayoutConfig:
      for_type: "SceneVerticalLayout"
      field_name: sceneVerticalLayoutConfig
      scene_item_fields:
        children: [arr, "REQUIRED - nested SceneItems at the SceneItem level (alongside type/guid), NOT inside config. Each child needs type, guid, and config. Cannot contain another SceneVerticalLayout."]
      fields:
        alignment: {_t: enum, values: [Top, Center, Bottom], default: Top, _note: "vertical arrangement of children within the column"}
        heightPercent?: [int, 'def:50', "10-100"]
        widthPercent?: [int, 'def:100', "10-100"]
        visibilityVariable: { ?varName?: [str]}
        enabledVariable: { ?varName?: [str]}
        repeatConfig: { ?isEnabled?: [bool, 'def:false'], ?dataSource?: {varName: [str], dictionaryKeys?: [arr, "optional key path to a nested dictionary/array, e.g. ['foo1'] to repeat over d1[foo1]"]}, _note: "when isEnabled+dataSource set, children render once per array/dict entry; descendants reference current item via {item}, {item.key}, {item.value}, {item.index}" }

    SceneGridLayoutConfig:
      for_type: "SceneGridLayout"
      field_name: sceneGridLayoutConfig
      scene_item_fields:
        children: [arr, "REQUIRED - nested SceneItems at the SceneItem level (alongside type/guid), NOT inside config. Each child needs type, guid, and config"]
      fields:
        itemsPerRow?: [int, 'def:3', "2-8"]
        rowHeight?: [int, 'def:64', "dp 20-400"]
        visibilityVariable: { ?varName?: [str]}
        enabledVariable: { ?varName?: [str]}
        repeatConfig: { ?isEnabled?: [bool, 'def:false'], ?dataSource?: {varName: [str], dictionaryKeys?: [arr, "optional key path to a nested dictionary/array, e.g. ['foo1'] to repeat over d1[foo1]"]}, _note: "when isEnabled+dataSource set, each cell renders the template once per array/dict entry; descendants reference current item via {item}, {item.key}, {item.value}, {item.index}" }

    SceneTableLayoutConfig:
      for_type: "SceneTableLayout"
      field_name: sceneTableLayoutConfig
      scene_item_fields:
        children: [arr, "REQUIRED - nested SceneItems at the SceneItem level (alongside type/guid), NOT inside config. Each child needs type, guid, and config"]
      fields:
        numColumns?: [int, 'def:2', "2-8"]
        columnWidths?: [arr, "floats summing to 100"]
        rowHeight?: [int, 'def:64', "dp 20-400"]
        showTableBorders?: [bool, T]
        tableBorderColor?: [int, 'def:-1']
        visibilityVariable: { ?varName?: [str]}
        enabledVariable: { ?varName?: [str]}
        repeatConfig: { ?isEnabled?: [bool, 'def:false'], ?dataSource?: {varName: [str], dictionaryKeys?: [arr, "optional key path to a nested dictionary/array, e.g. ['foo1'] to repeat over d1[foo1]"]}, _note: "when isEnabled+dataSource set, each row renders the children (chunked to numColumns) once per array/dict entry; descendants reference current item via {item}, {item.key}, {item.value}, {item.index}" }

    SceneHorizontalPagerConfig:
      for_type: "SceneHorizontalPager"
      field_name: sceneHorizontalPagerConfig
      fields:
        heightPercentage?: [int, 'def:50', "% 20-100"]
        useScrollableTabs?: [bool]
        visibilityVariable: { ?varName?: [str]}
        enabledVariable: { ?varName?: [str]}
        tabs: [arr, '"REQUIRED - PagerTab: {label, children (arr of SceneItems), visibilityVariable, enabledVariable}"']

    DataTypes:
      SceneVariableData: {varName: [str], dictionaryKeys?: [arr, "key path"]}
      SceneVariableUpdateValue:
        _desc: |
          Tagged union via 'type' field. Used by SceneButton/SceneImage/SceneIcon/SceneWebView variableUpdateValue.
          CRITICAL: scene variants use 'label' for the value field — NOT 'textValue' (textValue is DictionaryEntry only).
          DecimalValue is the sole exception: it uses 'value' instead of 'label'.
        variants:
          None:                   {type: None}
          IntIncrement:           {type: IntIncrement}
          IntDecrement:           {type: IntDecrement}
          StringValue:            {type: StringValue, label: "<string>"}
          IntValue:               {type: IntValue, label: <long>}
          DecimalValue:           {type: DecimalValue, value: <double>}
          BooleanValue:           {type: BooleanValue, label: <bool>, isToggle?: <bool>}
          ExpressionValue:        {type: ExpressionValue, label: "<expr>"}
          ExpressionValueDecimal: {type: ExpressionValueDecimal, label: "<expr>"}
          RangeValue:             {type: RangeValue, min: <long>, max: <long>}
          DecimalRangeValue:      {type: DecimalRangeValue, min: <double>, max: <double>}
        booleans_note: "For 'set true' use {type: BooleanValue, label: true}. For 'set false' use {type: BooleanValue, label: false}. For 'toggle' use {type: BooleanValue, label: false, isToggle: true} (label is ignored when isToggle=true)."
        example_string: {type: StringValue, label: "Кнопка 1"}
      SceneAlignment: '{Start, End, Center, Split}'
      ButtonClickConfig: {runnableItem: {name: [str], guid: [long, "MUST match the action block m_GUID - NOT 0"], isActionBlock: [bool]}, actionBlockData?: [ActionBlockData, "see ActionBlockData schema"]}
      SceneImageData: {imageResourceName: [str], imageResourceId: [int], imagePackageName: [str], imageUri: [str], type: [str, 'STATIC_FILE|DYNAMIC_FILE|URL|GIPHY'], directoryUri: [str, "SAF tree URI"], filename: [str], useAllFilesAccess: [bool], allFilesDirectoryPath: [str, "direct file path"]}
      ActionBlockData: "See ActionBlockData in macrodroid-llm-schema.yaml"

    CompleteExample:
      description: "Full CustomSceneAction example. Every item MUST have type, guid, and matching config."
      json:
        m_classType: "CustomSceneAction"
        m_SIGUID: 0
        sceneDescription:
          sceneConfig:
            name: "Settings"
            blockNextActions: false
            backgroundColor: -16777216
          itemList:
            items:
              - type: "SceneText"
                guid: 0
                sceneTextConfig:
                  text: "Settings"
                  textSize: "28"
                  textColor: -1
                  isBold: true
                  textAlignment: "Center"
              - type: "SceneSwitch"
                guid: 0
                sceneSwitchConfig:
                  text: "Notifications"
                  textColor: -1
                  alignment: "Split"
                  booleanVariable:
                    varName: "notif_enabled"
              - type: "SceneButton"
                guid: 0
                sceneButtonConfig:
                  text: "Option A"
                  textColor: -1
                  buttonColor: -16776961
                  closeSceneOnPress: false
                  variableToUpdate:
                    varName: "selected"
                  variableUpdateValue:
                    type: "StringValue"
                    label: "Option A"
              - type: "SceneButton"
                guid: 0
                sceneButtonConfig:
                  text: "Save"
                  textColor: -1
                  buttonColor: -16776961
                  closeSceneOnPress: true
        m_constraintList: []

    DarkThemeAction:
     description: Enable/disable/toggle dark theme
     note: Requires Write Secure Settings permission via ADB or root
     params:
     option: [int, '{0:Enable, 1:Disable, 2:Toggle}', "Dark theme state"]

    DayDreamAction:
     description: Start daydream/screensaver mode
     note: No parameters - simply starts the device's daydream (screensaver) mode
     params: {}

    DeleteVariableAction:
     description: Delete one or more variables, by single name, explicit list or name pattern
     note: |
      Three modes are supported via selectionMode. For backwards compatibility,
      omitting selectionMode (or setting it to 0) keeps the legacy single-variable
      behaviour driven by variableName.
     params:
     selectionMode?: [int, "0 = legacy single variable (uses variableName), 1 = explicit list (uses selectedVariableNames), 2 = text pattern (uses pattern / useRegex / patternScope)"]
     variableName?: [str, "Legacy single-variable name. Used when selectionMode is 0 or omitted. Supports magic text."]
     varDictionaryKeys?: [dictkeys, "Legacy dictionary entry path. Only honoured in legacy mode."]
     selectedVariableNames?: [arr, 'items:str', "List of variable names to delete. Used when selectionMode is 1. Names may refer to local or global variables; local takes precedence on name collision."]
     pattern?: [str, "Name pattern used when selectionMode is 2. Wildcards (* and ?) by default; full regex when useRegex is true. Anchored to the full variable name. Supports magic text."]
     useRegex?: [bool, "When selectionMode is 2: false (default) treats pattern as wildcards, true treats pattern as a Java regular expression."]
     patternScope?: [int, "When selectionMode is 2: 0 = Local variables only, 1 = Global variables only, 2 = Both (default)."]

    DimScreenAction:
     description: Add a dimming overlay to reduce screen brightness beyond system limits. This is NOT the same as SetBrightnessAction. Use DimScreenAction when you need to dim/darken the screen (it adds a dark overlay on top). Use SetBrightnessAction only to change the system brightness slider value.
     note: Requires Draw Over Other Apps permission
     params:
     m_dimScreenOn: [bool, T, "enable dim overlay|disable"]
     m_percent: [int, 'def:50', 0-100, "Dim percentage (0=transparent, 100=black)"]
     m_variable?: [obj, "Integer variable containing dim percentage"]
     varDictionaryKeys?: [dictkeys, "using dictionary variable"]
     overlayStatusBar?: [bool, "Also overlay status bar (requires Accessibility Service)"]

    DisableAppAction:
     description: Enable or disable applications using pm command
     note: Requires root access or Shizuku
     params:
     m_option: [int, '{0:Enable, 1:Disable}', "Enable or disable the app(s)"]
     usePackageNameOption: [int, '{0:Select apps from chooser, 1:Enter package name}', "App selection method"]
     m_packageNameList: [arr, 'when:usePackageNameOption=0', 'items:str', "List of package names to enable/disable"]
     m_applicationNameList?: [arr, 'items:str', "Display names of apps (for UI)"]
     customPackageName: [str, 'when:usePackageNameOption=1', magic, "entering manually"]

    DisableCameraAction:
     description: Enable/disable device camera via device admin
     note: Requires device admin or system helper app on Android 10+
     params:
     option: [int, '{0:Enable, 1:Disable, 2:Toggle}', "Camera state"]

    DisableCategoryAction:
     description: Enable/disable macros in a category
     params:
     m_category?: [str]
     m_enable: [bool]
     m_state: [int, '{0:Enable, 1:Disable, 2:Toggle}', "Enable/disable/toggle state"]
     categoriesList?: [arr, 'items:str', "List of category names (for multiple categories)"]
     enableMacrosOption:
     - int
     - opt
     - '{0:Don''t change macro states, 1:Enable all macros}'
     - "Which macros in the category to affect"

    DisableMacroAction:
     description: Enable, disable, or toggle another macro
     params:
     m_state?: [int, "Enable/disable action (-1=use m_enable, 0=Enable, 1=Disable, 2=Toggle)"]
     m_enable?: [bool, "Enable macro (when m_state=-1)"]
     m_GUID?: [long, "GUID of target macro"]
     m_macroName?: [str, magic, "macro (for display or name lookup) name"]
     getByName?: [bool, "Look up macro by name instead of GUID"]
     m_category?: [str, "Category filter"]
     m_userPromptTitle?: [str, magic, "Title for user prompt dialog"]

    DisableMacroDroidAction:
     description: Disable MacroDroid completely (stops all macro execution)
     params:
     state: [int, '{0:Prompt password if enabled, 1:Always disable (ignore password)}', "Password handling option"]

    DisableTriggerAction:
     description: Enable/disable specific trigger within a macro
     params:
     enableOption: [int, '{0:Enable, 1:Disable, 2:Toggle}', "Enable/disable option"]
     triggerGuid: [long, "SIGUID of the trigger to enable/disable"]
     macroGuid: [long, "GUID of the macro containing the trigger"]
     macroName?: [str, "the macro (for display purposes) name"]
     triggerName?: [str, "the trigger (for display purposes) name"]

    DisplayDensityAction:
     description: Change display density (DPI scale percentage)
     note: Requires WRITE_SECURE_SETTINGS permission via ADB
     params:
     scalePercent: [int, 50-150, "Display scale percentage (100 = default density)"]
     variable?: [var]
     varDictionaryKeys?: [dictkeys, "using dictionary variable"]

    EdgeLightingAction:
     description: Show animated edge lighting effect around screen borders with gradient colors
     notes:
     - Colors are Android color integers (e.g., -65536 = red, -16711936 = green, -16776961 = blue)
     - Use 0xFFRRGGBB as signed int for hex colors
     - 'Common colors: Red=-65536, Green=-16711936, Blue=-16776961, Yellow=-256, Cyan=-16711681, Magenta=-65281'
     params:
     option: [int, '{0:Show edge lighting, 1:Clear/hide edge lighting}']
     timeoutSeconds?: [int, 'def:10', "Auto-hide after this many seconds (0 = stay on until cleared). Used when timeoutText is empty."]
     timeoutText?: [str, magic, "Auto-hide delay in seconds as STRING (supports magic text, e.g. [v=delay]). Takes precedence over timeoutSeconds when set; resolves to 0 = stay on until cleared."]
     borderWidthDps?: [int, 'def:8', 1-50, "Width of the edge light border in dp"]
     color1?: [int, 'def:-65536', "First gradient color as Android color int (legacy, use colors array instead)"]
     color2?: [int, 'def:-16711936', "Second gradient color as Android color int (legacy, use colors array instead)"]
     colors?: ['int[]', "Array of Android color integers for multi-color gradient (preferred over color1/color2)"]
     colorVariables?: [arr, 'items:VariableWithDictionaryKeys', "Optional, same length as colors. Entry i is {variableName: <Colour variable name>, keys?: {...}} to take colour i from a Colour variable at run time, or null to use the fixed colors[i] value. Omit when no colour variables are used."]
     cornerRadius?: [int, 'def:-1', "Corner radius in dp (-1 = auto-detect from device screen)"]
     featherEffect?: [float, 'def:0.0', 0.0-1.0, "Feather/blur effect intensity (0.0 = sharp, 1.0 = maximum blur)"]
     alpha?: [float, 'def:1.0', 0.0-1.0, "Opacity of the edge lighting (0.0 = transparent, 1.0 = opaque)"]
     drawOverSystemApps?: [bool, "Draw over lock screen/system apps (requires accessibility service)"]

    ElseAction:
     description: Else branch of if statement
     params: {}

    ElseIfConditionAction:
     description: Else If condition check - executes child actions if conditions are met and previous If/ElseIf was false
     note: |
       Must be placed between an IfConditionAction and EndIfAction. Uses constraints to evaluate conditions.
       IMPORTANT: ElseIfConditionAction does NOT close the If block. The entire chain still requires a
       final EndIfAction. No matter how many ElseIf branches exist, there must be exactly ONE EndIfAction
       at the end: IfConditionAction -> [ElseIfConditionAction]... -> [ElseAction] -> EndIfAction
     params:
     m_constraintList: [arr, 'items:Constraint', "List of constraints that must be satisfied for the Else If block to execute"]
     m_isOrCondition?: [bool, "OR logic (any constraint)|AND logic (all constraints)"]
     dontLogIfConditionIsFalse?: [bool, "condition evaluates to false"]

    ElseIfConfirmedThenAction:
     description: Else If with user confirmation - shows dialog and executes child actions if user confirms and previous If/ElseIf was false
     note: Must be placed between an IfConditionAction and EndIfAction. Shows confirmation dialog to user.
     params:
     title?: [str, magic, "Dialog title"]
     text?: [str, magic, "Dialog message text"]
     positiveText?: [str, magic, "Text for positive/confirm button"]
     negativeText?: [str, magic, "Text for negative/cancel button"]
     quitOnBackPressed?: [bool, "back button is pressed"]
     cancelAfterTimeout?: [bool, "Auto-cancel the dialog after timeout"]
     timeoutSeconds?: [int, 'def:30', "Timeout in seconds before auto-cancel (if cancelAfterTimeout is true)"]

    EncryptDecryptTextAction:
     description: Encrypt or decrypt text using AES-256
     params:
     option: [int, '{0:Encrypt, 1:Decrypt}', "Encrypt or decrypt operation"]
     sourceText: [str, magic, "Text to encrypt/decrypt"]
     password: [str, magic, "Encryption password/key"]
     outputVariableName: [str, "String variable name for encrypted/decrypted result"]
     dictionaryKeys?: [dictkeys, "Dictionary keys for nested storage of result"]
     successVariableName?: [str, "Boolean variable name to store success/failure status"]
     successDictionaryKeys?: [dictkeys, "Dictionary keys for nested storage of success status"]

    EndIfAction:
     description: End of if/else block
     params: {}

    EndLoopAction:
     description: End of loop block - closes a LoopAction
     note: Every LoopAction MUST have a matching EndLoopAction. Actions between LoopAction and EndLoopAction will be repeated.
     params: {}

    ExpandCollapseStatusBarAction:
     description: Expand or collapse the notification status bar
     params:
     m_option: [int, '{0:Expand status bar, 1:Collapse status bar}', "Status bar operation"]

    ExportMacrosAction:
     description: Export all macros to a file (.mdr/.emdr) or store the export JSON in a string variable
     blocking_action: true
     params:
     option:
     - int
     - req
     - def:0
     - '{0:Export to file, 1:Export to MacroDroid variable}'
     - "Export destination"
     m_fileName?: [str, magic, 'when:option=0', "Filename without extension (extension is .mdr or .emdr if encrypted)"]
     m_filePath?: [str, 'when:option=0', "Legacy file system path for export directory"]
     m_pathUri?: [str, 'when:option=0', "SAF tree URI for export directory"]
     m_displayPath?: [str, "Human-readable display path"]
     useAllFilesAccess?: [bool, 'when:option=0', "Use All Files Access mode instead of SAF (Android 11+)"]
     allFilesPath?: [str, magic, 'when:option=0,useAllFilesAccess=true', "Direct file path for All Files Access mode"]
     encryptOutput?: [bool, 'def:false', "Encrypt the exported file (changes extension to .emdr)"]
