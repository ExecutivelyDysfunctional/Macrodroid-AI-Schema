     description: Measure the sound level from an audio input (microphone by default) for a set period and save the maximum, average and/or minimum level into number variables. Levels are in dB relative to the maximum input level (dBFS), so 0 dB is the loudest possible value and silence is around -96 dB (louder sounds give values closer to 0). Blocks until the capture period has elapsed and the variables have been set. At least one output variable must be set (users usually only need the maximum). Requires the record audio permission.
     params:
     audioSourceOption?: [int, 'def:0', '{0:Microphone, 1:Camcorder, 2:Voice Recognition, 3:Voice Communication, 4:Unprocessed (raw) (Android 7+, falls back to microphone), 5:Default}']
