     chartType:
     - enum
     - req
     - '{COLUMN:Column (bar) chart, LINE:Line chart, PIE:Pie chart, SCATTER:Scatter plot}'
     - "chart to create type"
     lineMode?: [str, '{LINEAR:Straight lines, STEPPED:Stepped, CUBIC_BEZIER:Smooth curve, HORIZONTAL_BEZIER:Smooth horizontal curve}', 'def:CUBIC_BEZIER', 'when:chartType=LINE', "Line rendering mode"]
     displayMode:
     - enum
     - req
     - '{DISPLAY_IMMEDIATELY:Display immediately, SAVE_TO_FILE:Save to file}'
     - "How to display/save the chart"
     chartTitle?: [str, magic, "Title shown at top of chart"]
     xAxisLabel?: [str, magic, "Label for X axis"]
     yAxisLabel?: [str, magic, "Label for Y axis"]
     backgroundColor?: [int, 'def:-1', "ARGB format"]
     foregroundColor?: [int, 'def:-16777216', "ARGB format"]
     linePointColor?: [int, "ARGB format"]
     useCustomBarColors?: [bool, "Use custom colors for each bar/pie slice"]
     customBarColors?: [arr, 'items:int', "ARGB format"]
     startYAxisAtZero?: [bool, T, "Force Y axis to start at zero"]
     startXAxisAtZero?: [bool, T, "Force X axis to start at zero"]
     xAxisLabelRotation?: [int, "Rotation angle for X axis labels (degrees)"]
     useFixedYAxisRange?: [bool, "Use fixed Y axis range instead of auto-scale"]
     minYAxisValue: [str, 'when:useFixedYAxisRange', magic, "Minimum Y axis"]
     maxYAxisValue: [str, 'when:useFixedYAxisRange', magic, "Maximum Y axis"]
     blockNextActions?: [bool, 'def:false', 'when:displayMode=DISPLAY_IMMEDIATELY', "Block next actions until chart is closed"]

    CustomSceneAction:
     description: Display custom scene with UI elements
     notes:
     - Configure via Scene Designer UI
     - 'Components: buttons, text, inputs, checkboxes, sliders, images'
     - Colors as ARGB ints (-1=white, -16777216=black)
     - 'Shared scene mode: instead of embedding a sceneDescription, the action can link a scene from the user''s shared scene library by setting sharedSceneGuid/sharedSceneName. When generating macros always embed sceneDescription (leave sharedSceneGuid 0 / sharedSceneName empty) - shared scene guids are device-specific and cannot be invented.'
     params:
     sharedSceneGuid?: [long, "0 unless linking an EXISTING shared scene by guid - never invent one"]
     sharedSceneName?: [str, "empty unless linking an EXISTING shared scene - name fallback for resolution"]
     sceneVariableBindings?: [obj, "only in linked mode: map of shared-scene variable name -> host variable name (macro local or global), or a same-typed entry inside a host dictionary/array written as "name[key][subkey]" (literal keys, no magic text). Empty when not linking."]
     sceneDescription:
     _t: obj
     _req: true
     _desc: Scene config with items and display options (used when sharedSceneGuid is 0)
     sceneConfig:
     _t: obj
     _req: true
     name: [str, "scene name"]
     blockNextActions?: [bool, "block until dismissed"]
     displayOption?: [obj, "Dialog/Activity/Overlay. Overlay supports: widthOption, widthValue, heightOption, heightValue, xValue, yValue, overlayStatusBar, longPressToMove, preventRemovalByBin, drawOverSystemApps (bool, uses accessibility overlay to draw over lock screen/system apps), showPositionOnMove (bool, shows toast with X,Y percentage position when overlay is dragged)"]
     foregroundColor?: [int, "fg color ARGB"]
     backgroundColor?: [int, "bg color ARGB"]
     itemList:
     _t: obj
     _req: true
     items:
      _t: arr
      _req: true
      _desc: "Array of SceneItem objects. Format: {type, guid: 0, scene<Type>Config: {...}}"

    SceneItem:
      description: "CRITICAL: Every item MUST have type, guid, and its matching config. Missing type = item silently dropped."
      required_fields:
        type: [str, "REQUIRED - component class name from type_mapping below. Without type the item is discarded."]
        guid: [long, "always 0"]
      type_specific_config: "config object named scene<Type>Config (e.g. sceneButtonConfig for SceneButton)"
      type_mapping:
        SceneButton: sceneButtonConfig
        SceneText: sceneTextConfig
        SceneEditText: sceneEditTextConfig
        SceneCheckBox: sceneCheckBoxConfig
        SceneSwitch: sceneSwitchConfig
        SceneSlider: sceneSliderConfig
        SceneVerticalSlider: sceneVerticalSliderConfig
        SceneDropDownSelection: sceneDropDownConfig
        SceneOptionSelector: sceneOptionSelectorConfig
        SceneImage: sceneImageConfig
        SceneIcon: sceneIconConfig
        SceneHorizontalDivider: config
        SceneSpacer: sceneSpacerConfig
        SceneProgressIndicator: sceneProgressIndicatorConfig
        SceneWebView: sceneWebViewConfig
        SceneMapView: sceneMapViewConfig
        SceneTimePicker: sceneTimePickerConfig
        SceneDatePicker: sceneCalendarConfig
        SceneHorizontalLayout: sceneHorizontalLayoutConfig
        SceneVerticalLayout: sceneVerticalLayoutConfig
        SceneGridLayout: sceneGridLayoutConfig
        SceneTableLayout: sceneTableLayoutConfig
        SceneHorizontalPager: sceneHorizontalPagerConfig
      container_note: "Layout containers (SceneHorizontalLayout, SceneGridLayout, SceneTableLayout) need 'children' array at SceneItem level (not inside config). SceneHorizontalPager children go inside tabs in config."

    # CONFIG OBJECTS FOR EACH TYPE

    SceneButtonConfig:
      for_type: "SceneButton"
      field_name: sceneButtonConfig
      fields:
        text: [str, "label"]
        textSize?: [str, 'def:"20"', "sp"]
        textColor?: [int, 'def:-1', "ARGB"]
        buttonColor?: [int, 'def:-16777216', "bg ARGB"]
        fontFamily?: [str, "font"]
        htmlFormatting?: [bool]
        textAlignment: {_t: enum, values: [Start, End, Center], default: Center}
        buttonClickConfig:
          runnableItem: { ?name?: [str], guid?: [long, "MUST match the action block m_GUID (use placeholder prefix e.g. 112233445566771). NOT 0."], isActionBlock?: [bool]}
          actionBlockData?: [ActionBlockData, "see ActionBlockData schema"]
        closeSceneOnPress?: [bool, T]
        variableToUpdate: { ?varName?: [str], dictionaryKeys?: [obj]}
        variableUpdateValue?: [SceneVariableUpdateValue, "CRITICAL: StringValue uses 'label' (NOT 'textValue'). See DataTypes.SceneVariableUpdateValue for all variants."]
        visibilityVariable: { ?varName?: [str]}
        padding?: [str, 'def:"8"', "dp"]
        cornerRadius?: [int, 'def:4', "dp, 0-32"]

    SceneTextConfig:
      for_type: "SceneText"
      field_name: sceneTextConfig
      fields:
        text: [str]
        textSize?: [str, 'def:"20"', "sp"]
        textColor?: [int, 'def:-1', "ARGB"]
        isBold?: [bool]
        isItalic?: [bool]
        textAlignment: {_t: enum, values: [Start, End, Center], default: Start}
        fontFamily?: [str]
        htmlFormatting?: [bool]
        enableSelection?: [bool]
        maxLinesEnabled?: [bool]
        maxLines?: [str, 'def:"3"']
        autoSizeText?: [bool]
        enableAutoRefresh?: [bool, "refresh magic text"]
        visibilityVariable: { ?varName?: [str]}
        padding?: [str, 'def:"8"', "dp"]

    SceneEditTextConfig:
      for_type: "SceneEditText"
      field_name: sceneEditTextConfig
      fields:
        hintText?: [str, "hint shown when empty (NOT 'text')"]
        textSizeString?: [str, 'def:"16"', "sp (NOT 'textSize')"]
        textColor?: [int, 'def:-1']
        fontFamily?: [str]
        showBorder?: [bool, T]
        inputType: {_t: enum, values: [TEXT, INTEGER, DECIMAL], default: TEXT, _note: "INTEGER/DECIMAL restrict input and write a number"}
        stringVariable: { ?varName?: [str, "the variable written for every inputType (string, integer or decimal variable to match inputType)"]}
        isPassword?: [bool]
        visibilityVariable: { ?varName?: [str]}
        padding?: [int, 'def:16', "dp"]

    SceneCheckBoxConfig:
      for_type: "SceneCheckBox"
      field_name: sceneCheckBoxConfig
      fields:
        text?: [str, "label"]
        textSize?: [str, 'def:"20"', "sp"]
        textColor?: [int, 'def:-1']
        textStart?: [bool, "label left"]
        alignment: {_t: enum, values: [Start, End, Center, Split], default: Start}
        isChecked?: [bool]
        fontFamily?: [str]
        booleanVariable: {varName: [str]}
        visibilityVariable: { ?varName?: [str]}
        padding?: [str, 'def:"0"', "dp"]

    SceneSwitchConfig:
      for_type: "SceneSwitch"
      field_name: sceneSwitchConfig
      fields:
        text?: [str, "label"]
        textSize?: [str, 'def:"20"', "sp"]
        textColor?: [int, 'def:-1']
        switchOnColor?: [int, "ARGB for ON state, omit to use textColor"]
        switchOffColor?: [int, "ARGB for OFF state, omit to use textColor"]
        alignment: {_t: enum, values: [Start, End, Center, Split], default: Start}
        textStart?: [bool, "label left"]
        fontFamily?: [str]
        booleanVariable: {varName: [str]}
