     params:
     m_variable:
     _t: obj
     _req: true
     _desc: "Target variable (MacroDroidVariable object wrapped in m_variable key). Do NOT put m_name/m_type at top level - they must be nested inside m_variable. Example: {m_variable: {m_name: 'my_var', m_type: 2, isLocalVar: true}}. NOTE: m_stringValue/m_intValue/m_booleanValue here are the variable's CURRENT value, not the new value to set."
     m_name: [str, "var name"]
     m_type: [int, '{0:Boolean, 1:Integer, 2:String, 3:Decimal, 4:Dictionary, 5:Array, 6:Color}']
     m_booleanValue?: [bool, "bool value"]
