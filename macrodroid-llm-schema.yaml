    ControlMediaAction:
     description: Control media playback (play/pause/next/previous/stop)
     note: Either m_option (legacy string) or optionInt (preferred integer) can be used. Modes are mutually exclusive - set exactly one of m_simulateMediaButton, m_sendMediaPlayerCommands or controlMediaSession to true (all false = legacy default player broadcast). controlMediaSession is the most reliable mode for modern apps but requires notification access.
     params:
     m_option?: [str, "Legacy option string (e.g., Play/Pause, Volgende)"]
     optionInt?: [int, '{-1:Not set, 0:Play/Pause Toggle, 1:Previous, 2:Next, 3:Play, 4:Pause, 5:Stop}', "Media control action"]
     m_simulateMediaButton?: [bool, T, "Simulate hardware media button press (ordered ACTION_MEDIA_BUTTON broadcast)"]
     m_sendMediaPlayerCommands?: [bool, "Send media player commands to AudioManager"]
     controlMediaSession?: [bool, "Control the app's media session directly via MediaSessionManager transport controls (requires notification access; app must have an active media session - launch the app first if needed)"]
     m_packageName?: [str, "Target specific app package (used by m_simulateMediaButton and controlMediaSession modes; null = any/active)"]
     m_applicationName?: [str, "Target app display name"]

    CreateChartAction:
     description: Create chart image from array data and display or save it
     params:
     variableName: [str, "array variable containing chart data name"]
