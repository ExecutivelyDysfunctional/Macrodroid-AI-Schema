     varAsMagicText?: [str, magic, "Variable name defined via magic text (alternative to variableName)"]
     childrenCollapsed?: [bool, "Children are collapsed in edit view"]

    JavaAction:
     description: Execute Java/Kotlin code (BeanShell interpreter)
     note: >
      Uses BeanShell interpreter. Code runs in a sandbox with access to MacroDroid context.
      Built-in script bindings: 'appContext' (application Context), 'magicText' (evaluateString/evaluateInt/evaluateBoolean/evaluateDecimal),
      'variableSetter' (set MacroDroid variables - setString/setInt/setDecimal/setBoolean/setColor (hex string or packed ARGB integer)/setArray/setDict,
      each optionally taking a String[] of dictionary keys and/or a create-if-not-exist flag 1=Local 2=Global;
      in setArray/setDict JSON, a string value with a leading # (#RRGGBB or #AARRGGBB) only becomes a colour entry if it replaces an existing colour entry, otherwise it stays a string and for dictionaries a companion '<key>ColorVar' colour entry is added alongside it), 'globals' (share objects across scripts),
      'accessibility' (facade exposing the full standard AccessibilityService API - all public AccessibilityService methods
      e.g. getRootInActiveWindow/getWindows/findFocus/performGlobalAction/getSystemActions/dispatchGesture/getServiceInfo/setServiceInfo/
      getMagnificationController/getSoftKeyboardController/getFingerprintGestureController/getAccessibilityButtonController/takeScreenshot/
      setGestureDetectionPassthroughRegion/setTouchExplorationPassthroughRegion/attachAccessibilityOverlayToDisplay - but NO MacroDroid-specific methods;
      also isAvailable() and getContext() which returns the live accessibility service as a Context (null if none connected).
      'accessibility' is itself a Context (it wraps the live accessibility service), so all inherited Context methods can be called directly on it
      (getSystemService/getResources/getPackageName/getContentResolver/startActivity/...) e.g. a WindowManager that can add TYPE_ACCESSIBILITY_OVERLAY windows;
      MacroDroid-specific service methods are NOT exposed; version-gated methods no-op on older Android versions;
      requires the MacroDroid or UI Interaction accessibility service to be enabled),
      'activityHelper' (startActivityForResult(intent, timeoutMs) blocking - requires runInBackgroundThread=true;
      withActivity(callback) runs code with a transparent Activity that the script must finish()).
     params:
     scriptText: [str, magic, "Java/Kotlin code to execute"]
     blockNextAction?: [bool, T, "Block next action until script completes"]
     responseVariableName?: [str, "Variable name to store script return"]
     responseVarDictionaryKeys?: [dictkeys, "response variable is dictionary"]
     consoleVariableName?: [str, "Variable name to store console output"]
     consoleVarDictionaryKeys?: [dictkeys, "console variable is dictionary"]
     runInBackgroundThread?: [bool, "Run script in background thread"]

    JavaScriptAction:
     description: Execute JavaScript code
     note: Supports multiple JavaScript engines
     note2: "Scripts can set MacroDroid variables via setVariable(name, value), with the type detected from the value (string/number/boolean/array/object). Optional third argument is a key-path array for setting an element inside a dictionary or array, e.g. setVariable(\"dict\", \"val\", [\"key\"]). Optional fourth argument forces creation if the variable does not exist: \"local\" or \"global\" (pass null for keys if unused), e.g. setVariable(\"newVar\", 5, null, \"global\"). When the target variable (or targeted dictionary entry) is a colour, a hex string (#RRGGBB or #AARRGGBB) or packed ARGB integer value is coerced to a colour. When setting a whole array/object, a string value with a leading # (#RRGGBB or #AARRGGBB) only becomes a colour entry if it replaces an existing colour entry; otherwise it stays a string and (for objects) a companion '<key>ColorVar' colour entry is added alongside it. Supported on the JetPack JavascriptEngine, QuickJS and Rhino engines (not JSEvaluator)."
     note3: "Magic text can be evaluated to a typed value via magicText.evaluateInt/evaluateString/evaluateDecimal/evaluateBoolean with a literal magic text string, e.g. magicText.evaluateInt(\"{battery}\"). Standard magic text elsewhere in the script is still replaced once at the start."
     note4: "Objects can be shared globally across script runs (and with Java actions) via globals.set/get/has/remove/clearAll/listAll, e.g. globals.set(\"key\", value) then globals.get(\"key\"). Reads see the values present at script start; writes are persisted after the script finishes. Supported on the JetPack JavascriptEngine, QuickJS and Rhino engines (not JSEvaluator)."
     params:
     scriptText: [str, magic, "JavaScript code to execute"]
     blockNextAction?: [bool, T, "Block next action until script completes"]
     stringVariableName?: [str, "Variable name to store script return"]
     stringVarDictionaryKeys?: [dictkeys, "Dictionary keys if result variable is dictionary"]
     consoleVariableName?: [str, "Variable name to store console.log output (JetPack JavascriptEngine, QuickJS and Rhino engines; not JSEvaluator)"]
     consoleVarDictionaryKeys?: [dictkeys, "Dictionary keys if console variable is dictionary"]
     javascriptEngine?: [str, "JavaScript engine (Rhino, V8, JetPack JavascriptEngine)"]

    JsonOutputAction:
     description: Convert dictionary variable to JSON string
     note: Converts MacroDroid dictionary to JSON string (no template support)
     params:
     stringVarName: [str, "Target string variable name for JSON output"]
     stringDictionaryKeys?: [dictkeys, "Dictionary keys to store JSON string in nested location"]
     dictionaryVarName: [str, "Source dictionary variable name to convert to JSON"]
     dictionaryKeys?: [dictkeys, "Dictionary keys to access nested source dictionary"]

    JsonParseAction:
     description: Parse JSON string from variable into dictionary or array variable
     note: Converts JSON string to MacroDroid dictionary or array structure (no JSONPath support). When the output variable is an array and the JSON root is an array, the array is populated directly. When the output variable is a dictionary and the JSON root is an array, the array is stored under an "entries" key. When the output variable is an array and the JSON root is an object, the object is stored as a dictionary at index 0 of the array.
     params:
     stringVarName: [str, "Source string variable name containing JSON text"]
     stringDictionaryKeys?: [dictkeys, "Dictionary keys to access nested source string"]
     dictionaryVarName: [str, "Target dictionary or array variable name for parsed JSON structure"]
     dictionaryKeys?: [dictkeys, "Dictionary keys to store parsed result in nested location"]
     parseColors?: [bool, T, "Parse strings with a leading # matching #RRGGBB or #AARRGGBB into colour values instead of strings"]

