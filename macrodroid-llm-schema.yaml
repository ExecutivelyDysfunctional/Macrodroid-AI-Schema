     m_triggerName: [str, "REQUIRED - Display name of the trigger, e.g. 'Timer Trigger: 7:00 AM Mon-Fri'. Must not be omitted."]
     m_not?: [bool, 'def:false', "false: Constraint passes when the macro WAS invoked by the specified trigger. true: Constraint passes when the macro was NOT invoked by the specified trigger"]

    USBTetheringConstraint:
     description: Check USB tethering state
     params:
     option: [int, '{0:Enabled, 1:Disabled}', "USB tethering is enabled or disabled"]

    UsbDeviceConnectedConstraint:
     description: Check if USB device is connected
     params:
     option: [int, '{0:USB device connected, 1:USB device not connected}', "USB device is connected"]

    VolumeConstraint:
     description: Check device ringer/volume mode. Use this or VolumeLevelConstraint for silent state checks.
     params:
     m_option: [int, '{0:Normal (sound on), 1:Vibrate only, 2:Silent, 3:Vibrate or Silent}', "Volume mode to check"]

    VolumeLevelConstraint:
     description: Check if specific audio stream volumes are above/below/equal to a level
     params:
     m_streamIndexArray: ['bool[]', 'len:7', '"[Alarm, Media / Music, Notification, Ringer, System Sounds, Voice Call, Bluetooth Voice]"']
     m_volume: [int, 'def:50', 0-100]
     m_comparison: [int, '{0:Less than, 1:Greater than, 2:Equals}']

    VpnConstraint:
