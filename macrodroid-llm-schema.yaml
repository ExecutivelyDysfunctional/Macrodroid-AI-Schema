     m_decimalValue?: [double, "decimal value"]
     isLocalVar?: [bool, "is local"]
     isLocal?: [bool, "is local"]
     excludeFromLog?: [bool, "no log"]
     m_otherBooleanVariable:
     _t: obj
     _desc: Other boolean variable to copy value from
     m_name?: [str, "var name"]
