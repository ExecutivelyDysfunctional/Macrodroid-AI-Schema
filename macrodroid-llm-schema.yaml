    ClearNotificationsAction:
     description: Clear notifications from status bar with filtering options
     note: Requires Notification Access permission
     params:
     m_option: [int, '{0:Clear all, 1:Select apps, 2:Notification trigger}', "Notification selection mode"]
     m_packageNameList?: [arr, 'when:m_option=1', 'items:str', "List of app package names to filter"]
     m_applicationNameList?: [arr, 'when:m_option=1', 'items:str', "List of app display names (for UI)"]
     m_matchOption?: [int, '{0:Any, 1:Matches, 2:Contains, 3:Excludes}', "Text matching option (used when separateTitleAndMessage is false)"]
     m_matchText?: [str, magic, "Text to match against notification title/content"]
     m_excludes?: [bool, "Exclude selected apps instead of including them"]
     m_ageInSeconds?: [int, "Only clear notifications older than this many seconds"]
     m_clearPersistent?: [bool, "Also clear persistent/ongoing (non-dismissible) notifications, removed via snoozing. When false (default) such notifications are left in place"]
     enableRegex?: [bool, "Enable regex matching for text filters"]
     ignoreCase?: [bool, "Ignore case when matching text"]
     titleContent?: [str, magic, "Title text to match (when separateTitleAndMessage is true)"]
     messageContent?: [str, magic, "Message/body text to match (when separateTitleAndMessage is true)"]
     separateTitleAndMessage?: [bool, "Use separate matching for title and message"]
     matchOptionTitle?: [int, 'when:separateTitleAndMessage', '{0:Any, 1:Matches, 2:Contains, 3:Excludes}', "Title matching option"]
     matchOptionMessage?: [int, 'when:separateTitleAndMessage', '{0:Any, 1:Matches, 2:Contains, 3:Excludes}', "Message matching option"]
     clearAllMatchingId?: [bool, 'when:m_option=2', "Clear every notification from the same app that shares the triggering notification's ID (apps may post multiple notifications with the same ID but different content). Default false clears only the exact triggering notification"]
     matchById?: [bool, 'when:m_option=0|1', "Only clear notifications whose numeric ID matches notificationIdText. Useful to clear a notification previously displayed with a known ID, regardless of its text content. Default false"]
     notificationIdText?: [str, magic, 'when:matchById', "Notification ID to match (supports magic text, e.g. a variable holding the ID or {not_id} captured from a NotificationTrigger). For notifications shown via NotificationAction use the same value as its notificationIdString - the internal ID offset is handled automatically"]

    ClearVariablesAction:
     description: Clear (reset) one or more variables to their empty state (strings "", numbers 0, booleans false), by explicit list or name pattern
     note: |
      Two modes are supported via selectionMode. For backwards compatibility, omitting
      selectionMode (or setting it to 0) keeps the original explicit-list behaviour
      driven by variableNames.
     params:
     selectionMode?: [int, "0 = explicit list (default, uses variableNames), 1 = text pattern (uses pattern / useRegex / patternScope)"]
     variableNames: [arr, 'items:str', "List of variable names to clear. Used when selectionMode is 0 or omitted. Supports magic text."]
     pattern?: [str, "Name pattern used when selectionMode is 1. Wildcards (* and ?) by default; full regex when useRegex is true. Anchored to the full variable name. Supports magic text."]
     useRegex?: [bool, "When selectionMode is 1: false (default) treats pattern as wildcards, true treats pattern as a Java regular expression."]
     patternScope?: [int, "When selectionMode is 1: 0 = Local variables only, 1 = Global variables only, 2 = Both (default)."]

