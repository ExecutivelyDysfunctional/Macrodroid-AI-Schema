     m_useFrontCamera?: [bool, "Use front camera (false = back camera)"]
     m_showIcon?: [bool, "Show camera icon notification"]
     m_flashOption?: [int, '{0:Off, 1:On, 2:Auto}', "Flash mode"]
     m_path?: [str, "Output file path (legacy, Android 9 and below only)"]
     newPath?: [str, "Output file path (legacy)"]
     pathUri?: [str, "Output folder URI (SAF)"]
     pathName?: [str, "Display name of output folder"]
     applyAutoFocus?: [bool, T, "Apply auto-focus before capture"]
     useAllFilesAccess?: [bool, F, "Use All File Access mode instead of SAF"]
     allFilesPath?: [str, "Direct filesystem path for All File Access mode (supports magic text)"]
     customFilename?: [str, "Custom filename without extension (supports magic text, null = timestamp default)"]

    TakeScreenshotAction:
     description: Take a screenshot and optionally save/share/email it
     note: Android 9+ uses accessibility service method
     params:
     m_option: [int, '{0:Save to device, 1:Send via email, 2:Share via intent}', "What to do with the screenshot"]
     m_mechanismOption:
     - int
     - opt
     - def:0
     - '{0:Standard dir - non root, 1:Standard dir - root, 2:Alternative dir - non root, 3:Alternative dir - root}'
     - "Screenshot mechanism (pre-Android 9)"
     m_email: [str, 'when:m_option=1', magic]
     emailSubject?: [str, magic, 'def:Screenshot', "Email subject"]
     emailBody?: [str, magic, "Email body text"]
     emailFrom?: [str, "From email address"]
     useSmtpEmail?: [bool, "Use SMTP instead of Gmail API"]
     saveToJpeg?: [bool, "Save as JPEG with GPS data (hidden feature)"]
     screenshotFormat?: [int, '{0:JPEG, 1:PNG}', 'def:0', "Image format for saved screenshot"]
     uiOption?: [int, '{0:Show UI, 1:No UI (hide animation)}', "UI visibility during screenshot"]
     useCustomSaveLocation?: [bool, 'when:m_option=0', "Save to a custom folder (via All Files Access) instead of the system default location"]
     customAllFilesPath?: [str, 'when:useCustomSaveLocation=true', magic, "Folder path the screenshot is saved to (requires All Files Access)"]
     useCustomFilename?: [bool, 'when:useCustomSaveLocation=true', "Use a custom filename instead of the auto-generated Screenshot_<timestamp> name"]
     customFilename?: [str, 'when:useCustomFilename=true', magic, "Custom filename (extension is appended automatically based on screenshotFormat)"]

    TerminateRunningAction:
     description: Terminate ONLY the current running instance of this macro (execution stops at this action)
     note: Ends just the invocation that executes it - no subsequent actions in that instance run. It does NOT stop any other running instances of the macro (e.g. a loop started by an earlier invocation keeps running). To stop other running instances - such as an ON/OFF toggle that must stop a running loop - use CancelActiveMacroAction targeting this macro (m_GUID 111) with excludeCurrentInstance true. No serialized parameters.
     params: {}

    TextManipulationAction:
     description: Perform various text manipulations using pluggable TextManipulation objects
     note: This action uses a complex polymorphic TextManipulation parcelable that varies by manipulation type. Output is stored in variableName.
     params:
     m_option?: [int, "Index of selected text manipulation type"]
     m_textManipulation:
     _t: obj
     _desc: TextManipulation object with type and params
     type?: [str, "Manipulation type name (e.g., ExtractTextManipulation)"]
     params?: [arr, 'items:str', "Manipulation parameters"]
     m_text?: [str, magic, "Source text to manipulate"]
     variableName?: [str, "Output variable name"]
     varDictionaryKeys?: [dictkeys, "Dictionary keys for nested storage"]

    ToastAction:
     description: Display a toast popup message
     params:
     m_messageText: [str, magic, "Message"]
     m_backgroundColor?: [int, "Background color (ARGB)"]
     m_imageResourceName?: [str, "Resource name for icon image"]
     m_imagePackageName?: [str, "Package name containing icon resource"]
     m_imageUri?: [str, "URI to custom icon image"]
     m_imageName?: [str, "Display name of icon image"]
     m_displayIcon?: [bool, "Show icon in toast"]
     m_tintIcon?: [bool, "Apply tint color to icon"]
     m_duration?: [int, '{0:Long, 1:Long (bug fix), 2:Short}', "Toast duration"]
     m_position?: [int, '{0:Bottom, 1:Center, 2:Top}', "Vertical position"]
     m_horizontalPosition?: [int, 'def:0', '{0:Center, 1:Left, 2:Right}', "Horizontal position"]
     m_textColor?: [int, 'def:-1', "Text color (ARGB, -1 = white)"]
     useTextOnly?: [bool, "Use simple toast (vs custom styled)"]
     textAlignment?: [int, 'def:0', '{0:Left, 1:Center, 2:Right}', "Horizontal text alignment (custom styled toast only)"]
     cancelPrevious?: [bool, "Cancel previous toast before showing"]
     maintainSpaces?: [bool, "Preserve multiple spaces in message"]

    TranslateTextAction:
     description: Translate text between languages using on-device ML Kit
     params:
     text: [str, magic]
     sourceLanguageCode: [str, "e.g., ''en'', ''es'', ''fr'', or ''macrodroid_default'' to use the current MacroDroid/device language"]
     outputLanguageCode: [str, "e.g., ''en'', ''es'', ''fr'', or ''macrodroid_default'' to use the current MacroDroid/device language"]
     variableName: [str, "String variable name to store translated text"]
     dictionaryKeys?: [dictkeys, "Dictionary keys for nested storage"]

    UDPCommandAction:
     description: Send UDP packet
     params:
     m_message: [str, magic, "Data/message to send"]
     m_destination: [str, magic]
     m_port: [int, 0-65535, "Destination port number (0 if using m_portVariableName)"]
     m_portVariableName?: [str, "Variable name for dynamic port (overrides m_port)"]
     varDictionaryKeys?: [dictkeys, "port variable is dictionary"]

    UIInteractionAction:
     description: Interact with UI elements (tap, click, swipe, type, press, touch, pinch zoom, rotate) or tap at screen coordinates. Replaces the legacy Touch Screen action - there is no 'TouchScreenAction'
     note: Complex action with UiInteractionConfiguration object
     params:
       uiInteractionConfiguration: [obj, "Parcelable configuration object containing all UI interaction settings"]
       action: [int, "Action type: 0=Click, 1=LongClick, 2=Copy, 3=Cut, 4=Paste, 5=ClearSelection, 6=Gesture, 7=GestureSequence, 8=PressEnter, 9=PinchZoom, 10=TwoFingerRotate"]

     configuration_types:
       Click:
         clickOption: [int, "0=CurrentFocus, 1=TextContent, 2=XYLocation, 3=IdentifyInApp, 4=ViewId"]
         longClick: [bool]
         longClickDuration: [int, "Optional hold time in ms for long clicks (gesture based clicks only). Omit/null = default 1000ms. Range 1-60000"]
         xyPoint: [obj, "Point with x,y coordinates"]
         xyPercentages: [bool, "true=percentage coordinates, false=pixel coordinates"]
         showTouchLocation: [bool, "When clickOption=2 (XYLocation), briefly show a circular ripple animation at the touch point"]
         textContent: [str, "Text to match for click"]
         textMatchOption: [int, "0=Contains, 1=ExactMatch"]
         blocking: [bool, "Wait for click result"]
         returnVariable: [obj, "Variable to store click success/failure"]

       Gesture:
         startX: [int]
         startY: [int]
         endX: [int]
         endY: [int]
         xyPercentages: [bool]
         durationMs: [int, "Duration of gesture in milliseconds"]
         waitBeforeNext: [bool, "Block next actions until complete"]
         additionalFingers: [int, "0 = one finger (default), 1 = two fingers. Extensible for future multi-finger support"]
         startX2: [int, "Finger 2 start X (when additionalFingers > 0)"]
         startY2: [int, "Finger 2 start Y (when additionalFingers > 0)"]
         endX2: [int, "Finger 2 end X (when additionalFingers > 0)"]
         endY2: [int, "Finger 2 end Y (when additionalFingers > 0)"]
         showTouchLocation: [bool, "Briefly draw the gesture path (line with a dot at each point and a dot animating along it to show direction) where the gesture occurs"]
         note: "All coordinate fields support variable names for dynamic values. Both finger paths are dispatched simultaneously with the same duration"

       GestureSequence:
         startX: [int]
         startY: [int]
         xyPercentages: [bool]
         durationMs: [int]
         waitBeforeNext: [bool]
         gestures: [arr, "List of GestureEntry objects with endX, endY coordinates"]
         showTouchLocation: [bool, "Briefly draw the gesture path (line with a dot at each point and a dot animating along it to show direction) where the sequence occurs"]

       PinchZoom:
         point1X: [int, "X coordinate of first finger"]
         point1Y: [int, "Y coordinate of first finger"]
         point2X: [int, "X coordinate of second finger"]
         point2Y: [int, "Y coordinate of second finger"]
         xyPercentages: [bool, "true=percentage coordinates, false=pixel coordinates"]
         zoomIn: [bool, "true=zoom in (fingers converge), false=zoom out (fingers diverge)"]
         zoomPercent: [int, "1-100, how far to move. 100% zoom in = fingers converge to center. 100% zoom out = fingers reach screen edge"]
         durationMs: [int, "Duration of gesture in milliseconds"]
         waitBeforeNext: [bool, "Block next actions until complete"]
         showTouchLocation: [bool, "Briefly draw both finger paths (line with endpoint dots and a dot animating along each to show direction) where the pinch occurs"]
         note: "All coordinate fields support variable names for dynamic values"

       TwoFingerRotate:
         point1X: [int, "X coordinate of first finger"]
         point1Y: [int, "Y coordinate of first finger"]
         point2X: [int, "X coordinate of second finger"]
         point2Y: [int, "Y coordinate of second finger"]
         xyPercentages: [bool, "true=percentage coordinates, false=pixel coordinates"]
         rotateDegrees: [int, "-360 to 360, positive=clockwise, negative=counter-clockwise"]
         durationMs: [int, "Duration of gesture in milliseconds"]
         waitBeforeNext: [bool, "Block next actions until complete"]
         showTouchLocation: [bool, "Briefly draw both finger arc paths (line with endpoint dots and a dot animating along each to show rotation direction) where the rotate occurs"]
         note: "Both fingers rotate around the center point between them. All coordinate fields support variable names for dynamic values"

       Paste:
         useClipboard: [bool, "true=paste from clipboard, false=use custom text"]
         forceClear: [bool, "Clear existing text before pasting"]
         text: [str, "Custom text to paste (when useClipboard=false)"]

    USBTetheringAction:
     description: Enable/disable/toggle USB tethering
     note: Requires root access or Shizuku
     params:
     m_option: [int, '{0:Turn On, 1:Turn Off, 2:Toggle}', "USB tethering state"]

    UpdateClipboardAction:
     description: Read the current clipboard content (forces clipboard refresh on Android 10+)
     note: On Android 10+, clipboard access requires user interaction - this action provides that
     params: {}

    UploadPhotoAction:
     description: Upload photo via email (uses Photo Taken trigger image)
     note: Uses image from Photo Taken trigger context
     params:
     m_option?: [str, "Upload option setting"]
     m_email?: [str, magic]
     emailSubject?: [str, magic, "Email subject line"]
     emailBody?: [str, magic, "Email body content"]
     emailFrom?: [str, magic, "From email address (SMTP mode)"]
     useSmtpEmail?: [bool, "Use SMTP instead of Gmail"]
     useHtml?: [bool, "Send email in HTML format"]

    VibrateAction:
     description: Vibrate the device with a pattern
     params:
     m_vibratePattern:
     - int
     - opt
     - '{0:Blip, 1:Short Buzz, 2:Long Buzz, 3:Rapid, 4:Slow, 5:Increasing, 6:Constant, 7:Decreasing, 8:Final Fantasy, 9:Game Over, 10:Star Wars, 11:Mini Blip, 12:Micro Blip}'
     - "Vibration pattern"
     waitToFinish:
     - boolean
     - opt
     - "Block next actions until vibration completes (default: false)"

    VoiceInputAction:
     description: Capture voice input and store in a variable
     note: Blocking action - pauses macro execution until complete
     params:
     variableName: [str, "string variable to store voice input name"]
     dictionaryKeys?: [dictkeys, "storing in dictionary entry"]
     language?: [str, "BCP-47 language tag for speech recognition (e.g. 'el-GR', 'en-US'). Omit/empty to use the system language."]

    VoiceSearchAction:
     description: Activate voice search
     params: {}

    VolumeIncrementDecrementAction:
     description: Increment or decrement the system volume by one step
     note: Uses the system's default volume step size. Affects the currently active audio stream.
     params:
     m_volumeUp: [bool, "volume up (increment)|volume down (decrement)"]
     showVolumePanel?: [bool, "Show the system volume panel when adjusting (default false)"]

    WaitUntilTriggerAction:
     description: Wait until specified trigger(s) fire
     note: |
       Blocks macro execution until trigger fires or timeout.
       IMPORTANT: The trigger objects in triggersToWaitFor are NESTED INSIDE this action's JSON object.
       They are NOT separate items in m_actionList. Trigger classTypes must NEVER appear as standalone
       entries in m_actionList - they can only exist in m_triggerList or nested inside WaitUntilTriggerAction.
     blocking_action: true
     example: |
       CORRECT - triggers nested inside the action:
       {"m_classType": "WaitUntilTriggerAction", "m_SIGUID": 0,
        "triggersToWaitFor": [{"m_classType": "ShakeDeviceTrigger", "m_SIGUID": 0}],
        "timeoutSeconds": 30, "timeoutEnabled": true}

       WRONG - triggers as separate m_actionList entries:
       {"m_classType": "WaitUntilTriggerAction", ...},
       {"m_classType": "ShakeDeviceTrigger", ...}   <-- INVALID: trigger in m_actionList
     params:
     triggersToWaitFor: [arr, 'items:Trigger', "List of trigger objects NESTED inside this action (not in m_actionList)"]
     timeoutSeconds?: [int, 'def:60', "Timeout duration in seconds"]
     timeoutEnabled?: [bool, "Enable timeout"]
     continueOnTimeout?: [bool, T, "timeout occurs"]
     booleanVariableName?: [str, "Variable to store trigger fired status (true/false)"]
     booleanVarDictionaryKeys?: [dictkeys, "boolean variable is dictionary"]
     useVariableTimeout?: [bool, "Use variable for timeout"]
     variableTimeoutUnit: [int, 'when:useVariableTimeout', '{0:Seconds, 1:Minutes, 2:Hours}', "Time unit for variable timeout"]
     timeoutVariableName: [str, 'when:useVariableTimeout', "Variable name containing timeout"]
     timeoutVariableDictionaryKeys?: [dictkeys, "timeout variable is dictionary"]
     useAlarm?: [bool, "Use alarm manager for timeout (more reliable)"]

    WearOsComplicationAction:
     description: Update Wear OS watch complication
     params:
     textContent?: [str, magic, "Text content to display on complication"]
     complicationType:
     - int
     - req
     - def:0
     - '{0:ShortText1, 1:ShortText2, 2:LongText1, 3:LongText2, 4:RangedValue1, 5:RangedValue2, 6:Icon1, 7:Icon2, 8:SmallImage1, 9:SmallImage2}'
     - "complication display type"
     imageResourceId?: [int, "Resource ID for icon"]
     imageResourceName?: [str, "Resource name for icon"]
     imagePackageName?: [str, "Package containing icon resource"]
     imageUri?: [str, "URI to custom icon image"]
     setIcon?: [bool, "set a custom icon"]

    WebHook2wayResponseAction:
     description: Send a deferred response back to the caller of a Webhook (with response) trigger (Pro version only)
     note: "Pro version only. Must be used in a macro invoked by WebHook2wayTrigger. Use this when the trigger has sendResponse=false so the reply can be assembled later in the macro (e.g. after a long-running action). The caller is identified via the callback info on the trigger context, so no targeting fields are needed here."
     params:
     option: [int, '{0:Plain text, 1:HTML}', "Response content type"]
     text?: [str, magic, "Plain text response body (when option=0)"]
     htmlText?: [str, magic, "HTML response body (when option=1)"]
     responseCode?: [int, 'def:OK', "HTTP response status (e.g., OK, Not Found)"]
     headerParams?: [arr, 'items:HttpParam', "Custom response headers - each item MUST use paramName/paramValue fields (see HttpParam type)"]

    WhatsAppAction:
     description: Send WhatsApp message
     params:
     number: [str, magic, "Phone number to send message to (with country code)"]
     messageText: [str, magic, "Message content"]
     prepopulateOnly?: [bool, "Only prepopulate message (don''t auto-send)"]
     exitAppAfter?: [bool, "Exit WhatsApp after sending"]
     isBusiness?: [bool, "Use WhatsApp Business app"]
     sendButtonPressDelayMs?: [int, 'def:2000', "Delay in milliseconds before pressing send button"]

    WifiSSIDScanAction:
     description: Scan for WiFi networks and store results
     note: Blocking action - waits for WiFi scan to complete
     blocking_action: true
     params:
     variableName: [str, "Dictionary variable name to store scan results"]
     isLocalVar?: [bool, "Is this a local variable"]
     dictionaryKeys?: [dictkeys, "storing in nested dictionary"]
     groupBy?: [int, '{0:By MAC Address, 1:By SSID}', "How to group scan results"]

    WriteToFileAction:
     description: Write content to a file
     params:
     m_logText: [str, magic, "Text content to write to file"]
     m_filename: [str, magic]
     m_append?: [bool, T]
     m_prepend?: [bool]
     overwrite?: [bool]
     m_path?: [str, "Legacy file path (deprecated)"]
     m_pathUri?: [str, "Storage Access Framework URI for folder"]
     m_pathName?: [str, "Display name of folder path"]
     useAllFilesAccess?: [bool, "Use All Files Access mode (Android 11+)"]
     allFilesPath?: [str, magic, "using All Files Access"]

# =============================================================================
# CONSTRAINTS
# =============================================================================
constraints:

    AccessibilityServiceStateConstraint:
     description: Check if accessibility service is enabled
     params:
     option: [int, '{0:Enabled, 1:Disabled}', "service is enabled or disabled"]
     idList?: [arr, 'items:str', "List of accessibility service IDs"]
     nameList?: [arr, 'items:str', "List of accessibility service display names"]

    ActionBlockInvocationMethodConstraint:
     description: Check how the action block was invoked
     params:
     option?: [int, 'def:-1', "Legacy option field (-1 means use selectedOptions array)"]
     selectedOptions:
     - bool[]
     - opt
     - len:12
     - "Array of action block invocation methods to check: [0:Action Block Action, 1:Shortcut, 2:Test Action Block, 3:Test Actions, 4:Google Assistant, 5:Quick Run, 6:Scene, 7:Floating Text Click, 8:Power Menu, 9:Overlay Bar Button, 10:Animation Overlay, 11:Direct Invocation]"
     notInvokedBy?: [bool, "check NOT invoked by|check invoked by"]

    ActiveApplicationConstraint:
     description: Check if an app is active/in foreground or running in background
     params:
     m_active: [bool, "app is active/running|app is not active/running"]
     m_foreground: [bool, "check foreground|check background"]
     m_packageName?: [str, "Single package name (legacy, use m_packageNameList instead)"]
     m_applicationName?: [str, "Single app display name (legacy, use m_applicationNameList instead)"]
     m_packageNameList?: [arr, 'items:str', "List of package names to check"]
     m_applicationNameList?: [arr, 'items:str', "List of app display names"]
     usePackageNameOption?: [int, '{0:Select from app chooser, 1:Enter package name}', "Selection method"]
     customPackageName?: [str, 'when:usePackageNameOption=1', magic, "Custom package name"]
     mechanismOption?: [int, 'def:0', '{0:Either (Accessibility or Usage Access), 1:Accessibility Service only, 2:Usage Access only}', "Detection mechanism"]

    AirplaneModeConstraint:
     description: Check if airplane mode is enabled or disabled
     params:
     m_enabled: [bool, "airplane mode enabled|disabled"]

    AmbientDisplayStateConstraint:
     description: Check ambient display (always-on display) state
     params:
     option: [int, '{0:Enabled, 1:Disabled}', "ambient display is enabled or disabled"]
     settingOption?: [int, '{0:Wake for notifications, 1:Always on}', "Settings option for ambient display"]

    AppEnabledConstraint:
     description: Check if an application is enabled or disabled on the device
     params:
     packageName: [str, magic, "Package name of the app to check"]
     appName: [str, "Display name of the app (optional, for UI display only)"]
     option: [int, "0 = Enabled, 1 = Disabled"]

    ApplicationInstalledConstraint:
     description: Check if an application is installed on the device
     params:
     packageName: [str, magic, "Package name of the app to check"]

    AutoRotateConstraint:
     description: Check if auto-rotate is enabled or disabled
     params:
     m_enabled: [bool, "auto-rotate enabled|disabled"]

    AutoSyncConstraint:
     description: Check if auto-sync is enabled or disabled
     params:
     m_enabled: [bool, "auto-sync enabled|disabled"]

    BatteryLevelConstraint:
     description: Battery level threshold
     common_mistakes: "This is a CONSTRAINT - it checks current state. It goes ONLY in m_constraintList, NEVER in m_triggerList. To DETECT battery level changes, use BatteryLevelTrigger in m_triggerList instead."
     params:
     m_greaterThan: [bool, "greater than threshold|less than threshold"]
     m_equals: [bool, "exact match (equals threshold exactly)"]
     m_batteryLevel: [int, 0-100, "Battery level percentage"]

    BatterySaverStateConstraint:
     description: Check battery saver mode state
     params:
     m_option: [int, '{0:Enabled, 1:Disabled}', "battery saver is enabled or disabled"]

    BatteryTemperatureConstraint:
     description: Battery temperature threshold
     params:
     greaterThan: [bool, "greater than threshold|less than threshold"]
     equals?: [bool, "exact match (equals temperature exactly)"]
     temperature: [int, 'def:30', 0-100, "Temperature in Celsius"]

    BluetoothConstraint:
     description: Bluetooth state constraint
     note: |
       Uses WirelessState enum values for m_btState.
       For "Device Connected" / "Device Not Connected" modes, multiple devices can be selected via
       m_deviceNameList (matched by OR). When m_excludeDevices is true the list is treated as the
       set of devices to *exclude* (so the constraint matches any device EXCEPT those listed).
       The legacy single-device fields (m_deviceName / m_deviceAddress / m_deviceAlias / m_anyDevice)
       are still honoured when m_deviceNameList is empty (backwards compatibility).
     params:
     m_btState:
     - int
     - req
     - '{0:Bluetooth Enabled, 1:Bluetooth Disabled, 2:Connected to device, 3:Not connected to device}'
     - "Bluetooth state to check"
     m_deviceNameList?: [string_array, "List of selected device names. Empty list means any/all devices."]
     m_deviceAddressList?: [string_array, "Parallel list of MAC addresses for entries in m_deviceNameList. May contain nulls for legacy entries."]
     m_deviceAliasList?: [string_array, "Parallel list of display aliases for entries in m_deviceNameList."]
     m_excludeDevices?: [bool, "When true the device list is the excluded set: matches any device EXCEPT those listed. Default false."]
     m_deviceName?: [str, "Legacy single device name. Ignored if m_deviceNameList is non-empty."]
     m_anyDevice?: [bool, "Legacy any-device flag. Ignored if m_deviceNameList is non-empty."]
     m_deviceAlias?: [str, "Legacy single device alias/display name."]

    BrightnessConstraint:
     description: Check screen brightness level or auto-brightness state
     params:
     m_greaterThan: [bool, "greater than threshold|less than threshold"]
     m_equals?: [bool, "exact match (equals brightness level exactly)"]
     m_isAutoBrightness?: [bool, "check if auto-brightness is enabled (ignores other params)"]
     m_brightness: [int, 'def:50', 0-100, "Brightness level percentage"]
     m_forcePieMode?: [bool, "Use Android Pie+ brightness curve (for Android 9+)"]

    CalendarConstraint:
     description: Check if currently in/not in a calendar event
     params:
     m_entrySet: [bool, "in event|not in event"]
     m_calendarId: [str, "Calendar ID to check"]
     m_calendarName?: [str, "Calendar display name"]
     calendarAccount?: [str, "Calendar account name"]
     m_titleText?: [str, magic, "Event title to match (wildcards supported)"]
     m_detailText?: [str, magic, "Event description to match"]
     m_availability?: [int, '{0:Any, 1:Busy, 2:Free}', "Event availability type (Tentative is not selectable in the app UI)"]
     m_ignoreAllDay?: [bool, "Ignore all-day events"]
     enableRegex?: [bool, "Use regex for matching"]
     ignoreCase?: [bool, T, "Case-insensitive matching"]
     m_advanceTimeSeconds?: [int, "Advance time in seconds"]
     m_checkInAdvance?: [bool, "Check event in advance"]
     m_negativeAdvanceCheck?: [bool, "Check event after it ends"]

    CameraCircleShowingConstraint:
     description: Check if the camera notification circle overlay (displayed via the Camera Notification Circle action) is currently showing
     params:
     option: [int, '{0:Camera circle showing, 1:Camera circle not showing}', "Camera circle state to check for"]

    CameraInUseConstraint:
     description: Check if camera is currently in use
     params:
      option: [int, '{0:Camera in use, 1:Camera not in use}', "Camera usage state"]
      cameraOption: [int, def:0, '{0:Any camera, 1:Back camera, 2:Front camera}', "Which camera to check"]

    CategoryEnabledConstraint:
     description: Check if a macro category is enabled
     params:
     option: [int, '{0:Enabled, 1:Disabled}', "category is enabled or disabled"]
     categoryName: [str, "the category to check name"]

    CellTowerConstraint:
     description: Check current cell tower
     params:
     m_inRange: [bool, "in range of specified towers|not in range"]
     m_cellGroupName?: [str, "cell tower group name"]
     m_cellIds: [arr, 'items:str', "List of cell tower IDs as strings"]

    ClipboardConstraint:
     description: Check if clipboard contents match a pattern (whole-text wildcard match, not contains). On Android 10+ background clipboard access is restricted - falls back to MacroDroid's last stored clipboard text (see ClipboardRefreshAction).
     params:
     text: [str, magic]
     enableRegex?: [bool, "Use regex instead of wildcard matching"]
     ignoreCase?: [bool, T, "matching (disabled if regex enabled)"]

    CompareValueConstraint:
     description: Compare two values
     params:
     type: [int, '{0:Boolean, 1:Integer, 2:String, 3:Decimal, 4:Dictionary, 5:Array, 6:Color}']
     value1: [str, magic, "First value to compare"]
     value2: [str, magic, "Second value to compare"]
     comparisonType:
     - int
     - req
     - '{0:Equals, 1:Not equals, 2:Less than, 3:Greater than, 4:Contains, 5:Excludes, 6:Contains key, 7:Excludes key, 8:Contains value, 9:Excludes value, 10:Matches key, 11:Matches value}'
     - "Comparison operator (0-3 for numbers, 0-1,4-5 for strings, 0-1,6-11 for arrays/dictionaries)"
     enableRegex?: [bool, "Use regex matching for text comparisons"]
     ignoreCase?: [bool, T, "Ignore case for text comparisons"]

    CustomSceneConstraint:
     description: Check if custom scene is visible
     params:
     identifier: [str, magic, "Scene identifier/GUID"]
     isShowing: [bool, "scene is visible|scene is not visible"]

    DarkThemeConstraint:
     description: Check if dark theme/night mode is enabled
     params:
     option: [int, '{0:Dark theme enabled, 1:Dark theme disabled}', "Theme mode to check"]

    DataOnOffConstraint:
     description: Check if mobile data is enabled or disabled
     params:
     m_dataOn: [bool, "mobile data enabled|disabled"]

    DataUsedConstraint:
     description: Check whether cellular or Wi-Fi data used over a configurable period exceeds (or is below) a threshold. Requires Usage Access permission. On Android 9 and below, reading cellular usage also requires the Phone (READ_PHONE_STATE) permission. To FIRE on a threshold crossing, use DataUsedTrigger instead.
     common_mistakes: "This is a CONSTRAINT - it checks current data usage. It goes ONLY in m_constraintList, NEVER in m_triggerList. The threshold can be a fixed value or read from a variable. The period can be a rolling window (e.g. last 24 hours) OR a calendar period (today/this week/this month with optional billing day)."
     params:
     networkType: [int, '{0:Cellular, 1:Wi-Fi}', "Which network to measure"]
     comparator: [int, '{0:>, 1:>=, 2:<, 3:<=}', "Comparison operator vs the threshold"]
     thresholdAmount: [float, 'when:!useVariableThreshold', "Threshold amount in the chosen unit (e.g. 500.0)"]
     thresholdUnit: [int, '{0:KB, 1:MB, 2:GB}', "Unit for thresholdAmount"]
     useVariableThreshold?: [bool, "Read threshold from a numeric variable instead of a fixed amount"]
     thresholdVariableName?: [str, 'when:useVariableThreshold', "Variable name holding the numeric threshold value"]
     thresholdVariableDictionaryKeys?: [dictkeys, 'when:useVariableThreshold', "Dictionary path for variable"]
     variableThresholdUnit?: [int, 'when:useVariableThreshold', '{0:KB, 1:MB, 2:GB}', "Unit the variable's value is in"]
     periodKind: [int, '{0:Rolling, 1:Calendar}', "Period mode"]
     rollingAmount?: [int, 'when:periodKind=0', "Rolling window amount (e.g. 24)"]
     rollingUnitMinutes?: [int, 'when:periodKind=0', '{1:Minutes, 60:Hours, 1440:Days}', "Rolling window unit (stored as minutes)"]
     calendarScope?: [int, 'when:periodKind=1', '{0:Today, 1:This week, 2:This month}', "Calendar period scope"]
     billingDay?: [int, 1-31, 'when:periodKind=1 and calendarScope=2', "Day of month the billing cycle begins (1-31). Days 29-31 wrap to the last day of months that don't have them (e.g. 31 → Feb 28/29)."]

    DayOfMonthConstraint:
     description: Check if current day matches specified days of month (1-31)
     params:
     m_daysOfMonth: ['bool[]', 'len:31', "Array of 31 booleans for days 1-31"]

    DayOfWeekConstraint:
     description: Only on specific days of week
     params:
     m_daysOfWeek: ['bool[]', 'len:7', '"[Sun-Sat]"']

    DeviceLockedConstraint:
     description: Check if device is locked or unlocked (covers 'device unlocked' checks - there is no DeviceUnlockedConstraint)
     note: "NOTE: There is no 'DeviceUnlockedConstraint'. Use DeviceLockedConstraint with m_locked: false for unlocked state, m_locked: true for locked state"
     params:
     m_locked: [bool, "device is locked|device is unlocked"]

    DeviceOrientationConstraint:
     description: Check if device is in portrait or landscape orientation
     params:
     m_portrait: [bool, "portrait|landscape"]

    DrawerStateConstraint:
     description: Check MacroDroid drawer state (supports both legacy and custom scene-based drawers)
     params:
     option: [int, '{0:Open, 1:Closed, 2:Enabled, 3:Disabled}', "drawer is open, closed, enabled or disabled"]
     drawerType?: [int, '{0:Legacy drawer (default), 1:Custom drawer}', "Which drawer system to check"]
     customDrawerId?: [str, "UUID of the custom drawer to check (null for any custom drawer). Only used when drawerType=1"]
     customDrawerName?: [str, "Display name of the custom drawer (for UI display only). Only used when drawerType=1"]

    EdgeLightShowingConstraint:
     description: Check if the edge notification light overlay (displayed via the Edge Notification Light action) is currently showing
     params:
     option: [int, '{0:Edge light showing, 1:Edge light not showing}', "Edge light state to check for"]

    ExternalPowerConstraint:
     description: Check if device is connected to external power
     params:
     m_externalPower: [bool, "power connected|power disconnected"]
     m_powerConnectedOptions?: ['bool[]', 'def:[true, true, true]', 'len:3', "Power types to accept: [0:Wired fast, 1:Wired slow, 2:Wireless]"]

    FaceUpDownConstraint:
     description: Check device physical orientation (face up, face down, vertical, sideways, in pocket). Also covers "flip device" scenarios - there is no separate FlipDeviceConstraint.
     common_mistakes: "This is a CONSTRAINT, not a trigger. To detect face-down/up EVENTS, use FlipDeviceTrigger. FaceUpDownConstraint only goes in m_constraintList, NEVER in m_triggerList."
     note: "NOTE: There is no 'FlipDeviceConstraint'. Use FaceUpDownConstraint to check device orientation (face up/down)"
     note: Requires accelerometer and magnetic field sensors. Sensors are only monitored while the screen is on unless the shared "Work With Screen Off" setting is enabled. If orientation cannot be determined the constraint passes.
     params:
     m_option:
     - int
     - opt
     - def:-1
     - '{-1:Not set, 0:Face up, 1:Face down, 2:Vertical upright, 3:Vertical upside down, 4:Sideways left, 5:Sideways right}'
     - "Legacy single option (deprecated, use m_selectedOptions)"
     m_selectedOptions:
     - bool[]
     - opt
     - len:6
     - '"[Face up, Face down, Vertical upright, Vertical upside down, Sideways left, Sideways right]"'

    FloatingButtonConstraint:
     description: Check floating button visibility
     params:
     identifier: [str, magic, "Floating button identifier"]
     isShowing: [bool, "button is visible|button is not visible"]

    FloatingTextConstraint:
     description: Check floating text visibility
     params:
     identifier: [str, magic, "Floating text identifier"]
     isShowing: [bool, "text is visible|text is not visible"]

    FoldAngleConstraint:
     description: Check foldable device fold angle. Requires Android 11+ and a hinge angle sensor.
     params:
     option: [int, '{0:Open, 1:Closed, 2:Half Open (90°)}', "Fold angle state to check (Open >=175°, Closed <2°, Half Open 85-95°)"]

    GPSEnabledConstraint:
     description: Check if GPS/Location is enabled
     params:
     m_enabled: [bool, "GPS enabled|disabled"]

    GeofenceConstraint:
     description: Check if device is inside/outside a geofence
     params:
     option: [int, '{0:Inside, 1:Outside}', "inside or outside geofence"]
     geofenceId: [str, "Geofence identifier"]
     geofenceName: [str, "Display name of the geofence"]
     allowUnknown?: [bool, "location is unknown"]
     updateRateText?: [str, "Text description of update rate"]
     updateRateMinutes?: [int, 'def:5', "Update rate in minutes"]

    HeadphonesConnectionConstraint:
     description: Check if headphones/audio output is connected
     note: Checks for wired headphones, wired headsets, and Bluetooth A2DP
     params:
     m_connected: [bool, "headphones connected|headphones not connected"]

    InCallConstraint:
     description: Check if device is in a phone call / a call is in progress (no IncomingCallConstraint or CallActiveConstraint exists)
     note: "NOTE: There is no 'CallActiveConstraint'. Use InCallConstraint to check if a call is active"
     params:
     m_inCall: [bool, "in call|not in call"]

    InvocationMethodConstraint:
     description: Check how the macro was invoked
     params:
     option?: [int, 'def:-1', "Legacy option field (-1 means use selectedOptions array)"]
     selectedOptions:
     - bool[]
     - opt
     - len:17
     - "Array of invocation methods to check: [0:MacroDroid Drawer, 1:Notification, 2:Option Dialog, 3:Run Macro Action, 4:Shortcut, 5:Google Assistant, 6:Quick Run, 7:Power Menu, 8:Other Standard Trigger, 9:Floating Text Click, 10:Test Actions, 11:Test Macro, 12:Scene, 13:Overlay Bar Button, 14:Animation Overlay, 15:Floating Button, 16:Floating Text Long Click]"
     notInvokedBy?: [bool, "check NOT invoked by|check invoked by"]

    IpAddressConstraint:
     description: Check device IP address
     params:
     ipAddress: [str, magic, "IP address or pattern to match (supports wildcards)"]
     matches: [bool, "IP matches pattern|IP does not match pattern"]

    IsAdbHackedConstraint:
     description: Check if ADB hack permissions are granted
     params:
     isAdbHacked: [bool, "ADB permissions granted|not granted"]
     adbOptionStates?: ['bool[]', 'len:5', '"[0:WRITE_SECURE_SETTINGS, 1:READ_LOGS, 2:SET_VOLUME_KEY_LONG_PRESS_LISTENER, 3:CHANGE_CONFIGURATION, 4:DUMP]"']

    IsRoamingConstraint:
     description: Check if device is roaming
     params:
     m_isRoaming: [bool]

    IsRootedConstraint:
     description: Check if device has root access
     params:
     m_rooted: [bool, "device is rooted|device is not rooted"]

    KeyboardShowingConstraint:
     description: Check if the soft keyboard is currently showing or hidden (requires accessibility service)
     params:
     option: [int, '{0:Keyboard showing, 1:Keyboard hidden}', "Keyboard state to check for"]

    LastRunTimeConstraint:
     description: Check time since macro last ran
     params:
     m_invoked: [bool, "invoked within time period|not invoked within time period"]
     m_timePeriodSeconds: [int, "Time period in seconds (used when useVariableTimePeriod is false)"]
     m_macroIds?: [arr, 'items:long', "List of macro GUIDs to check"]
     m_macroNames?: [arr, 'items:str', "List of macro names (display names)"]
     checkThisMacro?: [bool, T, "check this macro|check macros in list"]
     textToMatch?: [str, magic, "Text pattern to match macro names (wildcards supported)"]
     matchOption:
     - int
     - opt
     - def:0
     - '{0:Contains, 1:Matches (exact)}'
     - "How to match macro names when using textToMatch"
     useVariableTimePeriod?: [bool, def:false, "If true, take the time period from a numeric variable instead of m_timePeriodSeconds"]
     timePeriodVariableName?: [str, "Name of integer/decimal variable to read the time period from (when useVariableTimePeriod is true)"]
     timePeriodVariableDictionaryKeys?: [obj, "Dictionary keys when timePeriodVariableName references a dictionary/array entry"]
     variableTimePeriodUnit:
     - int
     - opt
     - def:0
     - '{0:Seconds, 1:Minutes, 2:Hours}'
     - "Unit applied to the variable value when useVariableTimePeriod is true"

    LauncherIsInForegroundConstraint:
     description: Constraint that is satisfied when a launcher (home screen) app is the current foreground app. Matches ANY installed launcher app, not only the default one.
     params:
     m_inForeground: [bool, "true if launcher must be in foreground, false if launcher must NOT be in foreground"]

    LightLevelConstraint:
     description: Check ambient light level from light sensor
     params:
     m_option: [int, '{0:Less than, 1:Greater than}', "Comparison mode"]
     m_lightLevel?: [int, "Light level threshold (legacy integer, use m_lightLevelFloat)"]
     m_lightLevelFloat: [float, "Light level threshold in lux"]

    LocationModeConstraint:
     description: Check GPS location mode setting (off, battery saving, high accuracy)
     params:
     m_options: ['bool[]', '"Array of location modes to match [Off, Sensors only, Battery saving, High accuracy]"']
     hasNewConfig?: [bool, T, "using new configuration format"]

    LogicConstraint:
     description: Combine constraints with AND/OR logic
     params:
     m_option: [int, '{0:AND - all must be true, 1:OR - any must be true, 2:XOR - exactly one must be true, 3:NOT}', "Logic mode for combining constraints"]
     m_childConstraints?: [arr, 'items:Constraint', "Child constraints to combine"]

    MacroDroidVariableConstraint:
     description: Check variable value condition - supports boolean, integer, decimal, string, and dictionary/array variables
     note: Parameters used depend on the variable type being checked.
     params:
     m_variable:
       _t: obj
       _req: true
       _desc: Variable to check (MacroDroidVariable object)
       m_name: [str, "Variable name"]
       m_type: [int, '{0:Boolean, 1:Integer, 2:String, 3:Decimal, 4:Dictionary, 5:Array, 6:Color}']
       m_booleanValue?: [bool, "Boolean value"]
       m_intValue?: [long, "Integer value"]
       m_stringValue?: [str, "String value"]
       m_decimalValue?: [double, "Decimal value"]
       isLocalVar?: [bool, "Variable is local to macro"]
     m_booleanValue?: [bool, "Expected boolean value (true/false) for boolean variable comparison"]
     m_intValue?: [long, "Integer value to compare against"]
     m_intGreaterThan?: [bool, "variable > value (for integer/decimal)"]
     m_intLessThan?: [bool, "variable < value (for integer/decimal)"]
     m_intNotEqual?: [bool, "variable != value (for integer/decimal)"]
     m_intCompareVariable?: [bool, "Compare against another variable instead of a fixed value"]
     m_otherValueToCompare?:
       _t: obj
       _desc: Other variable to compare against (MacroDroidVariable object)
       m_name?: [str, "Variable name"]
       m_type?: [int, "Variable type"]
       isLocalVar?: [bool]
     compareVarDictionaryKeys?:
       _t: dictkeys
       _desc: Dictionary keys for the comparison variable (if it's a dictionary/array)
       keys?: [arr, 'items:str']
     m_expression?: [str, magic, "Mathematical expression to evaluate for comparison (for integer/decimal)"]
     m_doubleValue?: [double, "Decimal value to compare against"]
     m_stringValue?: [str, magic, "String value to compare against"]
     m_stringComparisonType?: [int, 'def:0', '{0:Equality check (equals/not equals), 1:Contains, 2:Excludes (does not contain)}', "String comparison type"]
     m_stringEqual?: [bool, F, "equals|not equals (when m_stringComparisonType is 0)"]
     enableRegex?: [bool, "Use regex for string matching"]
     checkCase?: [bool, "Case-sensitive matching (true = case sensitive, false = ignore case)"]
     dictionaryKeys?:
       _t: dictkeys
       _desc: Keys to access nested dictionary/array entries
       keys?: [arr, 'items:str', "List of keys for nested access"]
     dictionaryType?: [int, 'def:-1', '{-1:Not set, 0:Boolean, 1:Integer, 2:String, 3:Decimal}', "Target dictionary/array entry type"]

    MacroEnabledConstraint:
     description: Check if a specific macro is enabled or disabled
     params:
     m_enabled: [bool, "enabled, false = check if disabled"]
     m_macroIds?: [arr, 'items:long', "List of macro GUIDs to check"]
     m_macroNames?: [arr, 'items:str', "List of macro names (display names)"]
     textToMatch?: [str, magic, "Text pattern to match macro names"]
     matchOption:
     - int
     - opt
     - def:0
     - '{0:Contains, 1:Matches (exact)}'
     - "How to match macro names"

    MacroRunningConstraint:
     description: Check if a specific macro is currently running
     params:
     option: [int, '{0:Running, 1:Not running}', "macro is running or not"]
     macroId?: [long, "GUID of specific macro to check"]
     macroName?: [str, "macro (display name) name"]
     textToMatch?: [str, magic, "Text pattern to match macro names"]
     matchOption:
     - int
     - opt
     - def:0
     - '{0:Contains, 1:Matches (exact)}'
     - "How to match macro names"

    MicrophoneRecordingConstraint:
     description: Check if the device microphone is currently in use by any app
     params:
       option: [int, '{0:Recording, 1:Not recording}', "microphone is recording or not"]

    ModeConstraint:
     description: Check if a specific mode is active
     params:
     m_mode: [str, "Mode name to check"]
     m_modeSelected: [bool, "mode is active|mode is not active"]
     m_variableName?: [str, "Variable name for dynamic mode selection"]
     varDictionaryKeys?:
       _t: dictkeys
       _desc: Dictionary keys for variable access (if variable is a dictionary/array)
       keys?: [arr, 'items:str', "List of keys for nested access"]

    MonthOfYearConstraint:
     description: Check if current month matches
     params:
     m_months: ['bool[]', 'len:12', "Array of 12 booleans for months [Jan, Feb, Mar, Apr, May, Jun, Jul, Aug, Sep, Oct, Nov, Dec]"]

    MusicActiveConstraint:
     description: Check if music/audio is playing. By default checks any playback. Set selectedAppsOnly=true with packageNameList to only check specific apps (via their media sessions, requires notification access).
     params:
     m_musicActive: [bool, "music playing|not playing"]
     selectedAppsOnly?: [bool, 'def:false', "When true only playback from the apps in packageNameList counts (works for music/video/podcast apps and browsers, not games or sound effects)"]
     packageNameList?: [arr, 'when:selectedAppsOnly=true', 'items:str', "Package names of the apps to check"]
     applicationNameList?: [arr, 'when:selectedAppsOnly=true', 'items:str', "Display names of the apps (same order as packageNameList)"]

    NFCStateConstraint:
     description: Check if NFC is enabled or disabled
     params:
     m_enabled: [bool, "NFC enabled|disabled"]

    NotificationPresentConstraint:
     description: Check if specific notification is present
     params:
     m_option: [int, '{0:Present, 1:Not present}', "notification is present or not"]
     m_textContent?: [str, magic, "Text content to match (legacy single field)"]
     m_packageNameList?: [arr, 'items:str', "List of package names to check"]
     m_applicationNameList?: [arr, 'items:str', "List of application display names"]
     m_exactMatch?: [bool, "Require exact match for text"]
     m_excludes?: [bool, "Exclude matching text"]
     enableRegex?: [bool, "Enable regex matching"]
     m_excludesApps?: [int, '{-1:Not set, 0:Include selected apps, 1:Exclude selected apps}', "App filtering mode"]
     ignoreOngoing?: [bool, "Ignore ongoing notifications"]
     ignoreCase?: [bool, 'def:true', "Case-insensitive text matching"]
     titleContent?: [str, magic, "Notification title to match"]
     messageContent?: [str, magic, "Notification message to match"]
     separateTitleAndMessage?: [bool, "Match title and message separately"]
     matchOptionTitle?: [int, '{0:Any, 1:Matches, 2:Contains, 3:Excludes}', "How to match title"]
     matchOptionMessage?: [int, '{0:Any, 1:Matches, 2:Contains, 3:Excludes}', "How to match message"]

    NotificationVolumeConstraint:
     description: Check notification volume level (sound, silent, loud, quiet)
     params:
     m_option: [int, '{0:Volume on (not silent), 1:Silent}', "notification volume is silent or not"]

    PhoneRingingConstraint:
     description: Check if phone is ringing
     params:
     m_ringing: [bool, "phone is ringing|phone is not ringing"]

    PriorityModeConstraint:
     description: Check Do Not Disturb / Priority mode
     params:
     m_selectedIndex: [int, '{0:All (DND off), 1:Priority only, 2:Total silence, 3:Alarms only}', "DND mode to check"]
     m_inMode: [bool, "in this mode|not in this mode"]

    ProximitySensorConstraint:
     description: Check proximity sensor state (near/far)
     common_mistakes: "This is a CONSTRAINT - it checks current state. It goes ONLY in m_constraintList, NEVER in m_triggerList. To DETECT proximity events (near/far/wave), use ProximityTrigger in m_triggerList instead."
     note: Uses physical proximity sensor; returns false if sensor not available
     params:
     m_near: [bool, "near (object close)|far (object away)"]

    QuickTileStateConstraint:
     description: Check MacroDroid quick settings tile state
     params:
     tileOption: [int, 'range:0-15', "Tile number to check (0-15)"]
     toggledState: [int, '{0:Active/On, 1:Off, 2:Inactive}', "State to check for"]

    RoamingOnOffConstraint:
     description: Check whether the data roaming SETTING is enabled or disabled. This checks the system setting only, NOT whether the device is currently roaming - use IsRoamingConstraint for the actual roaming state.
     params:
     m_roamingOn: [bool, "data roaming setting enabled|data roaming setting disabled"]

    ScreenOnOffConstraint:
     description: Screen display on/off state (wake, sleep, display active)
     common_mistakes: "This is a CONSTRAINT - it checks current state. It goes ONLY in m_constraintList, NEVER in m_triggerList. To DETECT screen on/off events, use ScreenOnOffTrigger in m_triggerList instead."
     params:
     m_screenOn: [bool, "screen on|screen off"]

    SensorValueConstraint:
     description: Only allows the macro to run when the current value reported by a chosen device sensor meets the defined condition. The sensor is read at the moment the constraint is checked (blocking up to 1 second, with a 2 second reading cache); if the sensor does not respond in time or is not present the constraint is not satisfied. Only sensors that can be sampled in real time are supported (continuous and on-change sensors). For multi-value sensors one component of the reading is tested, using the same component names as SensorReadAction dictionary keys (x, y, z, azimuth, pitch, roll, value0...). 3-axis sensors additionally support componentIndex -2 = magnitude sqrt(x²+y²+z²). Body sensors (heart rate 21, low latency off-body detect 34) are unavailable on Android 16+.
     params:
     sensorType: [int, "Android Sensor.TYPE_* constant of the sensor to check (e.g. 5=light, 8=proximity, 6=pressure, 13=ambient temperature, 12=relative humidity, 1=accelerometer, 4=gyroscope, 2=magnetic field)"]
     sensorName?: [str, "Exact sensor name used to disambiguate when multiple sensors share a type; falls back to the default sensor of that type"]
     componentIndex: [int, "Index of the reading component to test (0 for single-value sensors; 0=x, 1=y, 2=z for 3-axis sensors; -2 = magnitude of a 3-axis reading)"]
     comparisonOption: [int, '{0:Greater than, 1:Less than, 2:Is within range}', "Condition the current value must meet; 2 checks value is within [comparisonValue, comparisonValueMax] (inclusive)"]
     comparisonValue: [str, "Comparison value as a string (the range minimum when comparisonOption is 2); supports magic text such as {v=my_var}"]
     comparisonValueMax?: [str, "Range maximum as a string; only used when comparisonOption is 2; supports magic text"]

    ShizukuStateConstraint:
     description: Check if Shizuku service is running
     params:
     option: [int, '{0:Not installed, 1:Not running, 2:Running but no permission, 3:Running}', "Shizuku state"]

    SignalOnOffConstraint:
     description: Check if cellular service is available
     params:
     m_option: [int, '{0:Service available, 1:Service unavailable}', "Signal state to check"]
     subscriptionId: [int, "SIM subscription ID to check. -1 = any SIM (default). On multi-SIM devices, use the subscription ID of the specific SIM card to monitor."]

    SpeakerPhoneConstraint:
     description: Check if speakerphone is on or off during a call
     params:
     m_enabled: [bool, "speakerphone on|speakerphone off"]

    SpeakingTextConstraint:
     description: Check if text-to-speech is currently speaking
     params:
     option: [int, '{0:Speaking, 1:Not speaking}', "TTS is speaking or not"]

    StopWatchConstraint:
     description: Check stopwatch state and/or time value
     params:
     m_stopwatchName: [str, "the stopwatch to check name"]
     m_timePeriodSeconds?: [int, "Time value in seconds to compare against"]
     m_greaterThan?: [bool, T, "greater than time|less than time"]
     m_variableName?: [str, "Variable name for dynamic time"]
     allowRunning?: [bool, T, "stopwatch is running"]
     allowPaused?: [bool, T, "stopwatch is paused"]
     allowStopped?: [bool, T, "stopwatch is stopped"]
     checkValue?: [bool, T, "Check the time value (vs just checking state)"]

    SunsetSunriseConstraint:
     description: Check time relative to sunrise or sunset
     note: Requires location to be set in settings
     params:
     option: [int, '{0:Before sunrise, 1:After sunrise, 2:Before sunset, 3:After sunset}', "Time relation to check"]

    SystemSettingConstraint:
     description: Check Android system setting value
     params:
     valueType: [int, '{0:Integer, 1:Float, 2:Long, 3:String}', "value to compare type"]
     tableOption: [int, '{0:System, 1:Secure, 2:Global}', "Settings table to query"]
     settingString: [str, magic, "Setting name to check"]
     valueString: [str, magic, "Value to compare against"]
     equalityCheckOption:
     - int
     - req
     - '{0:Equals, 1:Not equals, 2:Less than or Contains, 3:Greater than or Excludes}'
     - "Comparison operator (2 and 3 have dual meaning based on valueType: numeric uses less/greater, string uses contains/excludes)"
     regexEnabled?: [bool, "Use regex for matching"]

    TimeOfDayConstraint:
     description: Only during specific time window
     params:
     m_startHour: [int, 0-23, "Start hour"]
     m_startMinute: [int, 0-59, "Start minute"]
     m_endHour: [int, 0-23, "End hour"]
     m_endMinute: [int, 0-59, "End minute"]

    TimeSinceBootConstraint:
     description: Check time since device boot
     params:
     m_timePeriodSeconds: [int, "Time period in seconds"]
     m_lessThan: [bool, "less than time|greater than time"]

    TorchConstraint:
     description: Check if flashlight/torch is on or off
     note: "NOTE: There is no 'CameraFlashLightConstraint'. Use TorchConstraint to check flashlight/torch state"
     params:
     option: [int, '{0:Torch on, 1:Torch off}', "Torch state to check"]

